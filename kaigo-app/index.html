<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>介護売上管理</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">介護売上管理</div>
    <nav class="tabs">
      <button class="tab active" data-view="dashboard">ダッシュボード</button>
      <button class="tab" data-view="entry">売上入力</button>
      <button class="tab" data-view="clients">利用者</button>
      <button class="tab" data-view="services">サービス分類</button>
    </nav>
    <div class="month-picker">
      <button id="prevMonth" aria-label="前月">‹</button>
      <span id="currentMonthLabel"></span>
      <button id="nextMonth" aria-label="翌月">›</button>
    </div>
  </header>

  <main>
    <!-- ダッシュボード -->
    <section id="view-dashboard" class="view active">
      <div class="kpi-row">
        <div class="kpi">
          <div class="kpi-label">当月売上</div>
          <div class="kpi-value" id="kpiTotal">¥0</div>
          <div class="kpi-sub" id="kpiDiff">前月比 ―</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">記録件数</div>
          <div class="kpi-value" id="kpiCount">0 件</div>
          <div class="kpi-sub" id="kpiClients">利用者 0 名</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">平均単価</div>
          <div class="kpi-value" id="kpiAvg">¥0</div>
          <div class="kpi-sub">1件あたり</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>サービス分類別の内訳</h2>
        </div>
        <div id="serviceBreakdown" class="breakdown"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>利用者別 売上ランキング（当月）</h2>
          <button class="btn-secondary" id="exportBtn">Excel出力</button>
        </div>
        <div id="clientRanking" class="ranking"></div>
      </div>

      <div class="quick-actions">
        <button class="btn-primary" data-jump="entry">今月の売上を入力する</button>
        <button class="btn-secondary" data-jump="clients">利用者を追加する</button>
      </div>
    </section>

    <!-- 売上入力 -->
    <section id="view-entry" class="view">
      <div class="card">
        <div class="card-header">
          <h2>売上入力</h2>
          <div class="entry-mode">
            <label><input type="radio" name="entryMode" value="monthly" checked /> 月単位</label>
            <label><input type="radio" name="entryMode" value="daily" /> 日単位</label>
          </div>
        </div>

        <div class="entry-toolbar">
          <button class="btn-secondary" id="copyPrevMonth">先月分をコピー</button>
          <span class="hint">同じ利用者・同じ金額を当月に複製します</span>
        </div>

        <form id="entryForm" class="entry-form">
          <div class="form-row">
            <label>利用者
              <select id="entryClient" required></select>
            </label>
            <label>サービス分類
              <select id="entryService" required></select>
            </label>
            <label id="entryDateLabel" style="display:none;">日付
              <input type="date" id="entryDate" />
            </label>
            <label>金額(円)
              <input type="number" id="entryAmount" min="0" step="1" required />
            </label>
            <label>備考
              <input type="text" id="entryNote" placeholder="任意" />
            </label>
            <button type="submit" class="btn-primary">記録する</button>
          </div>
        </form>

        <div class="table-wrap">
          <table id="entryTable">
            <thead>
              <tr>
                <th>日付</th>
                <th>利用者</th>
                <th>サービス分類</th>
                <th class="num">金額</th>
                <th>備考</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
              <tr>
                <td colspan="3" class="right">合計</td>
                <td class="num" id="entryTotal">¥0</td>
                <td colspan="2"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </section>

    <!-- 利用者 -->
    <section id="view-clients" class="view">
      <div class="card">
        <div class="card-header"><h2>利用者マスタ</h2></div>
        <form id="clientForm" class="inline-form">
          <input type="text" id="clientName" placeholder="氏名" required />
          <select id="clientCare">
            <option value="">要介護度（任意）</option>
            <option>要支援1</option><option>要支援2</option>
            <option>要介護1</option><option>要介護2</option><option>要介護3</option>
            <option>要介護4</option><option>要介護5</option>
          </select>
          <input type="text" id="clientNote" placeholder="備考(任意)" />
          <button type="submit" class="btn-primary">追加</button>
        </form>
        <div class="table-wrap">
          <table id="clientTable">
            <thead>
              <tr><th>氏名</th><th>要介護度</th><th>備考</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- サービス分類 -->
    <section id="view-services" class="view">
      <div class="card">
        <div class="card-header"><h2>サービス分類</h2></div>
        <form id="serviceForm" class="inline-form">
          <input type="text" id="serviceName" placeholder="分類名（例: 訪問介護）" required />
          <button type="submit" class="btn-primary">追加</button>
        </form>
        <div class="table-wrap">
          <table id="serviceTable">
            <thead><tr><th>分類名</th><th>使用件数</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="script.js"></script>
</body>
</html>
