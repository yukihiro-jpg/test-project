    var nameIdx=headers.findIndex(function(h){return String(h||'').indexOf('資料名')!==-1;});
    if (nameIdx===-1) {
      alert('ヘッダ行に「資料名」が見つかりません。\nテンプレートをご利用ください。');
      return;
    }
    var noteIdx=headers.findIndex(function(h){return String(h||'').indexOf('メモ')!==-1;});

    var docs=[];
    for (var i=1;i<parsed.length;i++) {
      var row=parsed[i];
      if (!row||row.every(function(c){return !String(c||'').trim();})) continue;
      var name=String(row[nameIdx]||'').trim();
      if (!name) continue;
      docs.push({
        name:name,
        note:noteIdx>=0?String(row[noteIdx]||'').trim():''
      });
    }
    if (docs.length===0) {
      alert('有効なデータ行（資料名が入った行）が見つかりません。'); return;
    }
    showRequiredDocsImportPreview(docs);
  };
  reader.readAsArrayBuffer(file);
  event.target.value='';
}

function showRequiredDocsImportPreview(docs) {
  _pendingRequiredDocsImport=docs;
  var existing=getRequiredDocs();
  var existingNames={};
  existing.forEach(function(d){ existingNames[d.name]=true; });

  var newCount=0, updCount=0;
  docs.forEach(function(d){
    if (existingNames[d.name]) updCount++;
    else newCount++;
  });

  var html='<div class="modal-title">📤 毎回提出する資料リストの取込確認</div>'
    +'<div style="font-size:12px;color:var(--gray-600);margin-bottom:10px;">取込件数: <strong>'+docs.length+'</strong> 件（新規 <span style="color:#059669;">'+newCount+'</span> 件 / 上書き <span style="color:#d97706;">'+updCount+'</span> 件）</div>'
    +'<div style="max-height:300px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:8px;">'
    +'<table style="width:100%;font-size:12px;border-collapse:collapse;">'
    +'<thead style="background:var(--gray-100);position:sticky;top:0;"><tr>'
    +'<th style="padding:6px 8px;text-align:left;">区分</th>'
    +'<th style="padding:6px 8px;text-align:left;">資料名</th>'
    +'<th style="padding:6px 8px;text-align:left;">メモ</th>'
    +'</tr></thead><tbody>';
  docs.forEach(function(d){
    var isUpd=existingNames[d.name];
    html+='<tr style="border-top:1px solid var(--gray-200);">'
      +'<td style="padding:5px 8px;">'+(isUpd?'<span style="color:#d97706;font-weight:600;">上書</span>':'<span style="color:#059669;font-weight:600;">新規</span>')+'</td>'
      +'<td style="padding:5px 8px;">'+esc(d.name)+'</td>'
      +'<td style="padding:5px 8px;">'+esc(d.note||'')+'</td>'
      +'</tr>';
  });
  html+='</tbody></table></div>';
  html+='<div style="font-size:11px;color:var(--gray-500);margin-top:8px;">※ 確定後、取り込んだCSVファイル自体はアプリ内に保存されません。</div>';
  html+='<div class="modal-actions">'
    +'<button class="btn btn-secondary" onclick="_pendingRequiredDocsImport=null;closeModal();showRequiredDocsManager();">キャンセル</button>'
    +'<button class="btn btn-primary" onclick="confirmImportRequiredDocs()">'+docs.length+'件を登録する</button>'
    +'</div>';
  showModal(html, true);
}

function confirmImportRequiredDocs() {
  if (!_pendingRequiredDocsImport) return;
  var arr=getRequiredDocs();
  var nameToIdx={};
  arr.forEach(function(d,i){ nameToIdx[d.name]=i; });
  var added=0, updated=0;
  _pendingRequiredDocsImport.forEach(function(d){
    if (nameToIdx[d.name]!=null) {
      arr[nameToIdx[d.name]]=Object.assign({}, arr[nameToIdx[d.name]], {name:d.name, note:d.note});
      updated++;
    } else {
      arr.push({name:d.name, note:d.note, createdAt:new Date().toISOString()});
      added++;
    }
  });
  saveRequiredDocs(arr);
  _pendingRequiredDocsImport=null;
  closeModal();
  alert('毎回提出する資料リストを更新しました。\n新規追加: '+added+'件\n上書き: '+updated+'件\n\n取込元のCSVファイルはアプリ内に保存されていません。');
  showRequiredDocsManager();
}

function showBankCsvSettings() {
  var profiles=bankGetProfiles();
  var h=bankGetHistory();
  var histCount=Object.keys(h).reduce(function(s,k){return s+h[k].length;},0);
  var profileHtml=profiles.length===0
    ?'<div style="font-size:12px;color:var(--gray-500);">保存された銀行・口座はありません</div>'
    :profiles.map(function(p,i){
      var label=esc(p.bankName||'(銀行名なし)')+(p.accountNo?' / '+esc(p.accountNo):'');
      return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">'
        +'<span style="flex:1;font-size:13px;">'+label+'</span>'
        +'<button class="btn btn-danger btn-xs" onclick="bankDeleteProfile('+i+');showBankCsvSettings();">削除</button>'
        +'</div>';
    }).join('');
  showModal('<div class="modal-title">🏦 銀行CSV設定</div>'
    +'<div class="divider"></div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--gray-700);margin-bottom:8px;">🔖 保存された銀行・口座（列マッピング設定）</div>'
    +'<div id="bank-profile-list">'+profileHtml+'</div>'
    +'<div class="divider"></div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--gray-700);margin-bottom:8px;">📚 摘要学習履歴</div>'
    +'<div style="font-size:12px;color:var(--gray-500);margin-bottom:10px;">登録件数: '+histCount+' 件</div>'
    +'<button class="btn btn-danger btn-sm" onclick="if(confirm(\'摘要の学習データを全て削除しますか？\')){DB.set(\'bank_history\',{});closeModal();alert(\'削除しました。\');}">🗑 学習履歴を全削除</button>'
    +'<div class="modal-actions">'
    +'<button class="btn btn-primary" onclick="closeModal()">閉じる</button>'
    +'</div>');
}

// ─────────────────────────────────────────────────────────────────────────────

function initApp() {
  try {
    checkAndRestoreAutoBackup();
    const s=getSettings();
    if (!s){
      var hcEl=document.getElementById('header-company');
      if (hcEl) hcEl.textContent='初期設定';
      document.getElementById('setup-screen').style.display='flex';
      return;
    }
    document.getElementById('setup-screen').style.display='none';
    updateHeader(); renderPage();
    doAutoSave();
  } catch (err) {
    console.error('initApp error:', err);
    const hc=document.getElementById('header-company');
    if (hc) hc.textContent='読み込みエラー';
    const pc=document.getElementById('page-content');
    if (pc) pc.innerHTML=`<div class="card"><div class="card-title">⚠️ 起動エラー</div>
      <p style="margin-bottom:10px;">アプリの初期化中にエラーが発生しました。</p>
      <pre style="background:#f8fafc;padding:10px;border-radius:6px;font-size:11px;overflow:auto;">${esc(err&&err.message||err)}</pre>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('imp-recover').click()">📤 バックアップから復元</button>
        <input type="file" id="imp-recover" accept=".json" style="display:none;" onchange="importBackup(event)">
        <button class="btn btn-danger btn-sm" onclick="if(confirm('全データを削除して初期状態に戻します。よろしいですか？')){localStorage.clear();location.reload();}">🗑️ データを全削除して再起動</button>
      </div></div>`;
  }
}

window.addEventListener('beforeunload', function(){ try { doAutoSave(); } catch(e){} });

if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', initApp);
else initApp();
</script>
