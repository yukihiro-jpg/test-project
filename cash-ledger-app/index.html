          <td><input type="text" id="sr-${i}-store" value="${esc(r.storeName)}" placeholder="〇〇ホテル" oninput="settleRows[${i}].storeName=this.value" onkeydown="rowFieldEnter(event,'sr',${i},'store')" onblur="recallAndFillRow('sr',${i})" /></td>
          <td><input type="text" id="sr-${i}-item" value="${esc(r.itemName)}"  placeholder="宿泊費" oninput="settleRows[${i}].itemName=this.value" onkeydown="rowFieldEnter(event,'sr',${i},'item')" /></td>
          <td><button id="sr-${i}-acct" class="acct-row-btn" onclick="showAcctRowPicker('settle',${i},'${esc(advId)}',${advAmt},this)">${r.account?`<span class="badge-acct" style="pointer-events:none;">${esc(r.account)}</span>`:'<span style="color:var(--gray-400);font-size:11px;">— 未分類 —</span>'} <span style="font-size:10px;color:var(--gray-400);">▼</span></button></td>
          <td><input type="text" id="sr-${i}-amt" inputmode="numeric" value="${fmtAmt}" placeholder="0" oninput="fmtAmtInput(this);settleRows[${i}].amount=this.value.replace(/,/g,'');updateSettleSummary(${advAmt})" onkeydown="rowFieldEnter(event,'sr',${i},'amt')" /></td>
          <td style="text-align:center;">${settleRows.length>1?`<button class="btn btn-secondary btn-xs" onclick="removeSettleRow(${i},'${esc(advId)}',${advAmt})">✕</button>`:''}</td>
        </tr>`;}).join('')}
      </tbody>
    </table>`;
  updateSettleSummary(advAmt);
}

function addSettleRow(advId, advAmt) {
  settleRows.push({date:'',storeName:'',itemName:'',amount:'',account:''});
  renderSettleRows(advId, advAmt);
}

function removeSettleRow(i, advId, advAmt) {
  settleRows.splice(i,1);
  renderSettleRows(advId, advAmt);
}

function updateSettleSummary(advAmt) {
  const total=settleRows.reduce((s,r)=>s+Number((r.amount||'').toString().replace(/,/g,'')||0),0);
  const diff=total-advAmt;
  const el=document.getElementById('settle-summary');
  if (!el) return;
  let diffHtml='';
  if (total>0){
    if (diff>0)       diffHtml=`<span style="color:var(--danger);font-weight:700;"> → 不足額 ${fc(diff)}（追加払い）</span>`;
    else if (diff<0)  diffHtml=`<span style="color:var(--success);font-weight:700;"> → 期待返金額 ${fc(Math.abs(diff))}（返金受取）</span>`;
    else              diffHtml=`<span style="color:var(--primary);font-weight:700;"> → 過不足なし</span>`;
  }
  el.innerHTML=`合計使用金額: <strong class="mono">${fc(total)}</strong>　／　仮払金額: <strong class="mono">${fc(advAmt)}</strong>${diffHtml}`;

  const wrap = document.getElementById('actual-return-wrap');
  if (wrap) {
    const methodEl = document.getElementById('st-method');
    const isCash = methodEl ? methodEl.value === 'cash' : true;
    wrap.style.display = (diff < 0 && isCash) ? 'block' : 'none';
    if (diff < 0 && isCash) {
      const dispEl = document.getElementById('return-expected-display');
      if (dispEl) dispEl.textContent = '¥'+Math.abs(diff).toLocaleString('ja-JP');
    }
  }
}

function setActualReturnMode(differs) {
  var inputWrap = document.getElementById('actual-input-wrap');
  var okWrap = document.getElementById('actual-ok-wrap');
  var yesBtn = document.getElementById('return-yes-btn');
  var noBtn = document.getElementById('return-no-btn');
  if (inputWrap) inputWrap.style.display = differs ? 'block' : 'none';
  if (okWrap) okWrap.style.display = differs ? 'none' : 'block';
  if (yesBtn) {
    yesBtn.style.background = differs ? 'white' : '#16a34a';
    yesBtn.style.color = differs ? '#374151' : 'white';
    yesBtn.style.border = differs ? '2px solid #d1d5db' : '2px solid #16a34a';
  }
  if (noBtn) {
    noBtn.style.background = differs ? '#fef3c7' : 'white';
    noBtn.style.color = differs ? '#92400e' : '#374151';
    noBtn.style.border = differs ? '2px solid #fcd34d' : '2px solid #d1d5db';
  }
  if (!differs) {
    var actEl = document.getElementById('st-actual');
    if (actEl) actEl.value = '';
  }
}

function submitSettle(id, advAmt) {
  const settlementDate=readDateGroupMD('st-date');
  const settlementMethod=document.getElementById('st-method').value;
  if (!settlementDate){ alert('精算日を入力してください。'); return; }
  if (settleRows.every(r=>!r.amount&&!r.storeName&&!r.itemName)){
    alert('使用明細を1件以上入力してください。'); return;
  }
  const items=settleRows.map(r=>({...r,amount:Number((r.amount||'').toString().replace(/,/g,'')||0)}));
  items.forEach(function(it){ if(it.storeName) learnStore(it.storeName, it.account, null, it.itemName); });
  const actEl = document.getElementById('st-actual');
  const actStr = actEl ? (actEl.value||'').replace(/,/g,'').trim() : '';
  const actualReturn = actStr === '' ? null : Number(actStr);
  const adv = settleAdvance(id,{settlementDate,settlementMethod,items,actualReturn});
  closeModal(); updateHeader(); renderPage();

  if (adv) {
    const yen = function(n){ return '¥'+Number(n).toLocaleString('ja-JP'); };
    const ch = settlementMethod==='cash' ? '現金' : '振込';
    let msg = '✅ 精算を確定しました。\n\n';
    if (adv.expectedReturn > 0) {
      const receive = adv.actualReturn != null ? adv.actualReturn : adv.expectedReturn;
      msg += `📌 ${adv.employeeName} さんから ${ch}で ${yen(receive)} を受け取ってください。\n`;
      if (adv.discrepancy && adv.discrepancy !== 0) {
        msg += `（期待返金額: ${yen(adv.expectedReturn)}）\n\n`;
        if (adv.discrepancy > 0) {
          msg += `⚠️ 差額 ${yen(adv.discrepancy)}（不足分）は「現金過不足」として現金出納帳に自動計上されました。`;
        } else {
          msg += `⚠️ 差額 ${yen(Math.abs(adv.discrepancy))}（超過分）は「現金過不足」として現金出納帳に自動計上されました。`;
        }
      }
    } else if (adv.shortageAmount > 0) {
      msg += `📌 ${adv.employeeName} さんに ${ch}で ${yen(adv.shortageAmount)} を追加で支払ってください。`;
    } else {
      msg += `📌 仮払金額と使用金額が一致しています。過不足はありません。`;
    }
    alert(msg);
  }
}

function confirmDeleteEntry(id) {
  if (confirm('この取引を削除しますか？')){ removeEntry(id); updateHeader(); renderPage(); }
}

function confirmDeleteAdv(id) {
  const adv=getAdvances().find(a=>a.id===id);
  if (!adv) return;
  var msg;
  if (adv.status==='settled') {
    var parts=['・仮払い時の出金記録'];
    if (adv.settlementEntryId)  parts.push('・精算時の入金/出金記録');
    if (adv.discrepancyEntryId) parts.push('・現金過不足の記録');
    msg='この精算済の仮払い記録（'+adv.id+'）を削除しますか？\n\n以下の出納帳記録もまとめて削除されます：\n'+parts.join('\n')+'\n\n※ この操作は取り消せません。';
  } else {
    msg='この仮払い記録（'+adv.id+'）を削除しますか？\n関連する出納帳の出金記録も削除されます。';
  }
  if (confirm(msg)) {
    if (removeAdvance(id)) { updateHeader(); renderPage(); }
  }
}

function todayJP() {
  var d=new Date();
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}

function exportTaxAccountantBundle() {
  var s=getSettings()||{};
  var locs=(s.locations||[]).slice();
  var jp=todayJP();
  var folderName='税理士提出_'+(s&&s.companyName?String(s.companyName).replace(/[\\/:*?"<>|]/g,'_'):'')+'_'+jp;
  var zipFiles=[];
  var safe=function(x){return String(x||'').replace(/[\\/:*?"<>|]/g,'_');};

  // 出力対象拠点: 拠点未登録なら [null]（ルート直下）、拠点ありなら各拠点を順番に
  var targets = locs.length>0 ? locs.slice() : [null];

  function addCsvFile(loc, name, rows){
    var sub = loc===null ? '' : safe(loc)+'/';
    zipFiles.push({name: folderName+'/'+sub+name, content: rowsToCsvString(rows)});
  }
  function filterByLoc(items, loc){
    if (loc===null) return items;
    return items.filter(function(it){return (it.location||'')===loc;});
  }

  // ── 拠点ごとに 現金出納帳・仮払・立替 を出力 ──
  targets.forEach(function(loc){
    var locLabel = loc===null ? '' : '拠点: '+loc;
    var openBal = loc===null
      ? (locs.length>0 ? getLocationOpenBalance('') : (s.openingBalance||0))
      : getLocationOpenBalance(loc);
    var ledgerEntries=filterByLoc(getEntries(), loc);
    var ledgerWithBal=calcBalancesFrom(ledgerEntries, openBal);
    var advancesAll=filterByLoc(getAdvances(), loc);
    var reimsAll=filterByLoc(getReimbursements(), loc);

    // 1. 現金出納帳
    addCsvFile(loc, '現金出納帳_'+jp+'.csv', [
      ['現金出納帳',s.companyName||'','出力日:'+today(),locLabel],
      ['日付','勘定科目','店名・支払先','購入品・内容','税区分','種別','入金（円）','出金（円）','残高（円）','メモ'],
      ...ledgerWithBal.map(function(e){return [
        e.date,
        e.account||'',
        e.storeName||'', e.itemName||e.description||'',
        e.taxRate===10?'課税10%':e.taxRate===8?'軽減8%':e.taxRate===0?'非課税':'',
        e.entryKind==='bank_withdraw'?'通帳引出':e.entryKind==='bank_deposit'?'通帳預入':e.type==='advance'?'仮払支払':e.type==='settlement'?'仮払精算':e.type==='reimbursement'?'立替返金':'一般',
        e.receiptAmount||'', e.paymentAmount||'', e.balance, e.memo||''
      ];})
    ]);

    // 2-4. 仮払関連 — 1件以上のみ
    if (advancesAll.length>0) {
      addCsvFile(loc, '仮払金台帳_'+jp+'.csv', [
        ['仮払金台帳',s.companyName||'','出力日:'+today(),locLabel],
        ['番号','仮払日','氏名','目的','仮払金額','精算日','精算方法','使用金額','返金額','不足額','状態','精算明細'],
        ...advancesAll.map(function(a){return [
          a.id,a.date,a.employeeName,a.purpose,a.advanceAmount,
          a.settlementDate||'',
          a.settlementMethod==='transfer'?'振込':a.settlementMethod==='cash'?'現金':'',
          a.usedAmount==null?'':a.usedAmount, a.returnAmount==null?'':a.returnAmount, a.shortageAmount==null?'':a.shortageAmount,
          a.status==='pending'?'未精算':'精算済',
          (a.settlementItems||[]).map(function(it){return (it.date?it.date+' ':'')+( it.storeName||'')+' '+(it.itemName||'')+' '+(it.amount||0)+'円';}).join(' / ')
        ];})
      ]);
      var detRows=[
        ['仮払精算明細表',s.companyName||'','出力日:'+today(),locLabel],
        ['番号','仮払日','氏名','目的','仮払金額','精算日','精算方法','使用日','相手先名称','内容','金額','状態']
      ];
      buildSettlementDetailRows().filter(function(r){
        if (loc===null) return true;
        // 元の仮払エントリの拠点で絞り込む
        var adv=advancesAll.find(function(a){return a.id===r.id;});
        return !!adv;
      }).forEach(function(r){
        detRows.push([
          r.id, r.advDate, r.employeeName, r.purpose, r.advanceAmount,
          r.settlementDate||'',
          r.settlementMethod==='transfer'?'振込':r.settlementMethod==='cash'?'現金':'',
          r.usageDate||'', r.storeName||'', r.itemName||'',
          r.amount!=null?r.amount:'',
          r.status==='pending'?'未精算':'精算済'
        ]);
      });
      addCsvFile(loc, '仮払精算明細表_'+jp+'.csv', detRows);
      addCsvFile(loc, '未精算一覧_'+jp+'.csv', [
        ['未精算一覧',s.companyName||'','出力日:'+today(),locLabel],
        ['番号','仮払日','氏名','目的','仮払金額'],
        ...advancesAll.filter(function(a){return a.status==='pending';}).map(function(a){
          return [a.id,a.date,a.employeeName,a.purpose,a.advanceAmount];
        })
      ]);
    }

    // 5. 立替経費台帳
    if (reimsAll.length>0) {
      var reimRows=[
        ['立替経費台帳',s.companyName||'','出力日:'+today(),locLabel],
        ['番号','登録日','氏名','目的','使用日','店名・支払先','内容','勘定科目','金額（円）','合計','返金日','返金方法','状態']
      ];
      reimsAll.forEach(function(r){
        if (!r.items||r.items.length===0) {
          reimRows.push([r.id,r.registeredDate,r.employeeName,r.purpose||'','','','','','',r.totalAmount,r.reimbursementDate||'',r.reimbursementMethod==='transfer'?'振込':r.reimbursementMethod==='cash'?'現金':'',r.status==='pending'?'未返金':'返金済']);
        } else {
          r.items.forEach(function(it,idx){
            reimRows.push([
              r.id, idx===0?r.registeredDate:'', idx===0?r.employeeName:'', idx===0?(r.purpose||''):'',
              it.date||'', it.storeName||'', it.itemName||'', it.account||'', it.amount||0,
              idx===0?r.totalAmount:'',
              idx===0?(r.reimbursementDate||''):'', idx===0?(r.reimbursementMethod==='transfer'?'振込':r.reimbursementMethod==='cash'?'現金':''):'',
              idx===0?(r.status==='pending'?'未返金':'返金済'):''
            ]);
          });
        }
      });
      addCsvFile(loc, '立替経費台帳_'+jp+'.csv', reimRows);
    }
  });

  // ── 銀行CSV・PDF提出資料リスト ──
  bankLoadAllSessions().then(function(sessions) {
    sessions=sessions||[];
    var completed=sessions.filter(function(s){return s.completed;});
    var pending=sessions.filter(function(s){return !s.completed;});
    if (sessions.length>0 && completed.length===0 && pending.length>0) {
      alert('銀行CSVは「登録完了」になったセッションだけが ZIP に含まれます。\n現在 '+pending.length+' 件のセッションが未完了のため、銀行出納帳ファイルは含まれません。');
    }
    // 銀行出納帳: 拠点に紐付かないため、拠点ありなら「銀行/」サブフォルダ、なしならルート
    var bankSub = locs.length>0 ? '銀行/' : '';
    completed.forEach(function(sess) {
      var rows=[
        ['銀行出納帳', sess.bankName||'', (sess.accountNo?'口座番号:'+sess.accountNo:''), '出力日:'+today()],
        ['日付','摘要','入金','出金','残高']
      ];
      (sess.rows||[]).forEach(function(r){
        rows.push([
          r.date||'',
          r.description||'',
          r.receipt>0?r.receipt:'',
          r.payment>0?r.payment:'',
          r.balance!==0?r.balance:''
        ]);
      });
      var fname='銀行出納帳_'+safe(sess.bankName||'銀行CSV')+(sess.accountNo?'_'+safe(sess.accountNo):'')+'_'+jp+'.csv';
      zipFiles.push({name: folderName+'/'+bankSub+fname, content: rowsToCsvString(rows)});
    });

    // PDF提出必要資料リスト: 各拠点のサブフォルダに同じものを配置（拠点ありの場合）
    var pdfList=buildPdfSubmissionList(completed, s.companyName);
    if (pdfList.length>2) {
      targets.forEach(function(loc){
        addCsvFile(loc, 'PDF提出必要資料リスト_'+jp+'.csv', pdfList);
      });
    }

    if (zipFiles.length===0) {
      alert('出力できるデータがありません。'); return;
    }
    downloadZip(zipFiles, folderName+'.zip');
    if (pending.length>0) {
      alert('ZIPに '+zipFiles.length+' ファイルを含めて出力しました。\n未完了の銀行セッション '+pending.length+' 件は含まれていません。');
    }
  }).catch(function(e){
    console.error('銀行CSV取得失敗:', e);
    if (zipFiles.length>0) downloadZip(zipFiles, folderName+'.zip');
  });
}

function bankCategoryLabel(reason) {
  if (reason==='loan') return '借入関連書類PDF';
  if (reason==='loan_repayment') return '借入返済関連書類PDF（返済予定表＋利息計算書）';
  if (reason==='auto') return 'この取引の請求書PDF';
  return '振込明細PDF';
}

function buildPdfSubmissionList(sessions, companyName, monthFilter) {
  var rows=[
    ['PDF提出必要資料リスト', companyName||'', '出力日:'+today()],
    ['区分','銀行名','口座番号','日付','元の摘要','入金（円）','出金（円）','提出書類区分','補完後摘要']
  ];
  // 1. 毎回提出する資料（選択月別）
  var requiredDocs=getRequiredDocs();
  var monthsForReq=(monthFilter&&monthFilter.length>0)?monthFilter:[];
  if (requiredDocs.length>0 && monthsForReq.length>0) {
    monthsForReq.slice().sort().forEach(function(mk){
      var monthLabel=bankFormatMonthShort(mk);
      requiredDocs.forEach(function(d){
        rows.push([
          '毎回提出',
          '', '', mk,
          d.name+'（'+monthLabel+'）',
          '', '',
          '毎回提出する資料',
          d.note||''
        ]);
      });
    });
  }
  // 2. 銀行CSVから抽出した needsPDF 行
  (sessions||[]).forEach(function(sess) {
    (sess.rows||[]).forEach(function(r) {
      if (bankClassifyRow(r)!=='needsPDF') return;
      var reason=bankRowReason(r);
      rows.push([
        '銀行明細',
        sess.bankName||'',
        sess.accountNo||'',
        r.date||'',
        r.descriptionOriginal||'',
        r.receipt>0?r.receipt:'',
        r.payment>0?r.payment:'',
        bankCategoryLabel(reason),
        r.description||''
      ]);
    });
  });
  return rows;
}

function bankCollectPdfSubmissionEntries(sessions) {
  var entries=[];
  (sessions||[]).forEach(function(sess) {
    (sess.rows||[]).forEach(function(r) {
      if (bankClassifyRow(r)!=='needsPDF') return;
      var reason=bankRowReason(r);
      var amt=r.receipt>0?r.receipt:r.payment;
      var category=reason==='loan'?'loan'
                  :reason==='loan_repayment'?'loan_repayment'
                  :reason==='auto'?'auto'
                  :'transfer';
      entries.push({
        bank:sess.bankName||'(銀行名未設定)',
        acct:sess.accountNo||'',
        date:r.date||'',
        orig:r.descriptionOriginal||'',
        amount:amt||0,
        isReceipt:r.receipt>0,
        category:category,
        desc:r.description||''
      });
    });
  });
  return entries;
}

function bankBuildRequiredDocsHtml(docs, selectedMonths) {
  if (!docs || docs.length===0 || !selectedMonths || selectedMonths.length===0) return '';
  function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  // 月は降順で表示（最新月から）
  var sortedMonths=selectedMonths.slice().sort(function(a,b){return b.localeCompare(a);});
  var lines='';
  sortedMonths.forEach(function(mk){
    var monthLabel=bankFormatMonthShort(mk);
    docs.forEach(function(d){
      var note=d.note?'（'+escH(d.note)+'）':'';
      lines+='<li style="margin-bottom:8px;line-height:1.7;"><strong>'+escH(d.name)+'</strong>'+note+' の <strong>'+escH(monthLabel)+'</strong>をご用意ください。</li>';
    });
  });
  var totalCount=docs.length*sortedMonths.length;
  return '<div class="required-section">'
    +'<h2>📋 毎回提出する資料 <span style="font-size:13px;font-weight:600;opacity:0.9;">('+totalCount+'件)</span></h2>'
    +'<ol class="nl-list">'+lines+'</ol>'
    +'</div>';
}

function bankBuildPdfListHtml(entries, companyName, dateStr, monthLabel, options) {
  options=options||{};
  var selectedMonths=options.selectedMonths||[];
  var requiredDocs=options.requiredDocs||[];
  // 銀行ごとにグループ化、さらに区分ごとに集約
  var byBank={};
  var bankOrder=[];
  entries.forEach(function(e){
    var bk=e.bank+'|'+e.acct;
    if (!byBank[bk]) {
      byBank[bk]={bankName:e.bank, accountNo:e.acct, byCategory:{transfer:[], loan:[], loan_repayment:[], auto:[]}};
      bankOrder.push(bk);
    }
    byBank[bk].byCategory[e.category].push(e);
  });

  var totalCount=entries.length + (requiredDocs.length*selectedMonths.length);
  var totalByCategory={transfer:0, loan:0, loan_repayment:0, auto:0};
  entries.forEach(function(e){ totalByCategory[e.category]++; });

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtAmt(n) {
    return n ? Number(n).toLocaleString('ja-JP') : '';
  }
  function catLabel(c){
    if (c==='loan') return '借入関連書類PDF (契約書・金消契約書等)';
    if (c==='loan_repayment') return '借入返済関連書類PDF (返済予定表・利息計算書)';
    if (c==='auto') return 'この取引の請求書PDF';
    return '振込明細PDF';
  }
  function catColor(c){
    if (c==='loan') return '#b91c1c';
    if (c==='loan_repayment') return '#9a3412';

      (sess.rows||[]).forEach(function(r){

        var mk=bankDateToMonthKey(r.date);

    });

function bankDownloadPdfListCSV() {
  var months=bankGetSelectedPdfMonths();
  if (months.length===0) { alert('対象月を1つ以上選択してください。'); return; }
  bankLoadAllSessions().then(function(sessions){
    sessions=sessions||[];
    var completed=sessions.filter(function(s){return s.completed;});
    var pool=completed.length>0?completed:sessions;
    var s=getSettings();
    var rows=buildPdfSubmissionList(pool, s.companyName||'', months);
    if (rows.length<=2) { alert('該当する取引も毎回提出する資料もありません。'); return; }
    var header=rows.slice(0,2);
    var data=rows.slice(2).filter(function(r){
      // 毎回提出（1列目='毎回提出'）は月フィルタ済みなのでそのまま含める
      if (r[0]==='毎回提出') return true;
      var mk=bankDateToMonthKey(r[3]);
      return mk && months.indexOf(mk)!==-1;
    });
    if (data.length===0) { alert('選択した月に該当するデータがありません。'); return; }
    closeModal();
    dlCSV(header.concat(data), 'PDF提出必要資料リスト_'+todayJP()+'.csv');
  });
}

function bankPrintPdfSubmissionList(monthFilter) {
  bankLoadAllSessions().then(function(sessions) {
    sessions=sessions||[];
    var completed=sessions.filter(function(s){return s.completed;});
    var pool=completed.length>0?completed:sessions;
    var entries=bankCollectPdfSubmissionEntries(pool);
    if (monthFilter && monthFilter.length>0) {
      entries=entries.filter(function(e){
        var mk=bankDateToMonthKey(e.date);
        return mk && monthFilter.indexOf(mk)!==-1;
      });
    }
    var requiredDocs=getRequiredDocs();
    var hasRequired=requiredDocs.length>0 && monthFilter && monthFilter.length>0;
    if (entries.length===0 && !hasRequired) {
      alert('税理士へ提出が必要な書類のある取引はありません。\n（毎回提出する資料も登録されていません。設定から登録できます。）');
      return;
    }
    var s=getSettings();
    var monthLabel=monthFilter && monthFilter.length>0
      ?monthFilter.sort().map(bankFormatMonth).join('・')
      :'全期間';
    var html=bankBuildPdfListHtml(entries, s.companyName||'', today(), monthLabel, {
      selectedMonths: monthFilter||[],
      requiredDocs: requiredDocs
    });
    var w=window.open('', '_blank');
    if (!w) {
      alert('ポップアップがブロックされました。ブラウザ設定でこのページのポップアップを許可してください。');
      return;
    }
    w.document.open();
    w.document.write(html);
    w.document.close();
    setTimeout(function(){
      try { w.focus(); } catch (e) {}
    }, 200);
  }).catch(function(e){
    alert('セッションの読み込みに失敗しました: '+(e&&e.message||e));
  });
}

// ─── きれいなExcel(.xls)ダウンロード（HTML形式・Excelが認識） ───
function _esx(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function _isNumericCell(v) {
  if (v==null||v==='') return false;
  var s=String(v).replace(/,/g,'');
  return /^-?\d+(\.\d+)?$/.test(s);
}
function downloadExcelXls(filename, opts) {
  // 正規 .xlsx 形式に変更（HTML.xlsだとExcelで警告が出るため）
  if (filename && /\.xls$/i.test(filename)) filename=filename.replace(/\.xls$/i, '.xlsx');
  if (filename && !/\.xlsx$/i.test(filename)) filename+='.xlsx';
  downloadExcelXlsx(filename, opts);
}

function _xlsxEsc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\r?\n/g, '&#10;'); }
function _xlsxColLetter(n) {
  var s='';
  while (n>0) { var r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); }
  return s;
}
function _xlsxIsNumeric(v) {
  if (v==null||v==='') return false;
  var s=String(v).replace(/,/g,'');
  return /^-?\d+(\.\d+)?$/.test(s);
}

function downloadExcelXlsx(filename, opts) {
  var sheetName=(opts.sheetName||'Sheet1').substring(0,31);
  var sections=opts.sections||[];
  var maxCols=sections.reduce(function(m,sec){return Math.max(m,(sec.headers||[]).length);},1);

  // 1. シートXML本体を組み立て
  var rowsXml='';
  var rowIdx=1;
  var mergeCells=[];

  function pushRow(cells) {
    var rowR=rowIdx;
    rowsXml+='<row r="'+rowR+'">';
    cells.forEach(function(c){
      var ref=_xlsxColLetter(c.col)+rowR;
      if (c.numeric && c.value!=='') {
        rowsXml+='<c r="'+ref+'" s="'+c.style+'"><v>'+c.value+'</v></c>';
      } else {
        rowsXml+='<c r="'+ref+'" t="inlineStr" s="'+c.style+'"><is><t>'+_xlsxEsc(c.value)+'</t></is></c>';
      }
    });
    rowsXml+='</row>';
    rowIdx++;
  }

  if (opts.title) {
    pushRow([{col:1, value:opts.title, style:1}]);
    if (maxCols>1) mergeCells.push(_xlsxColLetter(1)+(rowIdx-1)+':'+_xlsxColLetter(maxCols)+(rowIdx-1));
  }
  if (opts.subtitle) {
    pushRow([{col:1, value:opts.subtitle, style:2}]);
    if (maxCols>1) mergeCells.push(_xlsxColLetter(1)+(rowIdx-1)+':'+_xlsxColLetter(maxCols)+(rowIdx-1));
  }
  if (opts.title||opts.subtitle) rowIdx++; // spacer

  sections.forEach(function(sec, sIdx){
    if (sIdx>0) rowIdx++; // spacer
    if (sec.title) {
      pushRow([{col:1, value:sec.title, style:2}]);
      if ((sec.headers||[]).length>1) mergeCells.push(_xlsxColLetter(1)+(rowIdx-1)+':'+_xlsxColLetter(sec.headers.length)+(rowIdx-1));
    }
    var headers=sec.headers||[];
    var numCols=sec.numericCols||[];
    var headerCells=headers.map(function(h,ci){return {col:ci+1, value:h, style:3};});
    pushRow(headerCells);
    (sec.rows||[]).forEach(function(row,ri){
      var even=ri%2===1;
      var cells=row.map(function(c,ci){
        var v=c==null?'':String(c);
        var isNum=numCols.indexOf(ci)>=0 || _xlsxIsNumeric(v);
        var style;
        if (isNum) style=even?7:5;
        else style=even?6:4;
        var cellValue;
        if (isNum && v!=='') {
          cellValue=Number(v.replace(/,/g,''));
        } else {
          cellValue=v;
        }
        return {col:ci+1, value:cellValue, numeric:isNum&&v!=='', style:style};
      });
      pushRow(cells);
    });
    if (sec.totalRow) {
      var totalCells=sec.totalRow.map(function(c,ci){
        var v=c==null?'':String(c);
        var isNum=numCols.indexOf(ci)>=0 || _xlsxIsNumeric(v);
        var style=isNum?9:8;
        return {col:ci+1, value:(isNum&&v!=='')?Number(v.replace(/,/g,'')):v, numeric:isNum&&v!=='', style:style};
      });
      pushRow(totalCells);
    }
  });

  // 2. cols (列幅)
  var colsXml='';
  if (sections[0] && sections[0].colWidths) {
    colsXml='<cols>';
    sections[0].colWidths.forEach(function(w,i){
      colsXml+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';
    });
    colsXml+='</cols>';
  }

  // 3. mergeCells
  var mergeXml='';
  if (mergeCells.length>0) {
    mergeXml='<mergeCells count="'+mergeCells.length+'">';
    mergeCells.forEach(function(r){ mergeXml+='<mergeCell ref="'+r+'"/>'; });
    mergeXml+='</mergeCells>';
  }

  // 4. シートXML
  var sheetXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +colsXml
    +'<sheetData>'+rowsXml+'</sheetData>'
    +mergeXml
    +'</worksheet>';

  // 5. その他の必須ファイル
  var contentTypesXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'

  var relsXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'

    +'</Relationships>';

// 拠点フィルタコンテキスト
function _exportLocationContext() {
  var s=getSettings()||{};
  var locs=s.locations||[];
  var useLocFilter=locs.length>0 && currentLocation && locs.indexOf(currentLocation)!==-1;
  return {
    settings:s,
    locations:locs,
    useLocFilter:useLocFilter,
    selectedLocation:useLocFilter?currentLocation:null,
    locationLabel:useLocFilter?'拠点: '+currentLocation:(locs.length>0?'全拠点合計':''),
    locationSlug:useLocFilter?'_'+currentLocation.replace(/[\\/:*?"<>|]/g,'_'):(locs.length>0?'_全拠点':'')
  };
}
function _filterByLocation(items, ctx) {
  if (!ctx.useLocFilter) return items;
  return items.filter(function(it){return (it.location||'')===ctx.selectedLocation;});
}

// ─── ミニZIP実装（STOREモード、無圧縮） ────────────────────────
var _crcTable=(function(){
  var t=new Uint32Array(256), c, k;
  for (var n=0;n<256;n++) { c=n; for (k=0;k<8;k++) c=((c&1)?(0xEDB88320^(c>>>1)):(c>>>1)); t[n]=c>>>0; }
  return t;
})();
function _crc32(bytes) {
  var crc=0xFFFFFFFF;
  for (var i=0;i<bytes.length;i++) crc=(crc>>>8)^_crcTable[(crc^bytes[i])&0xFF];
  return (crc^0xFFFFFFFF)>>>0;
}
function _strToBytes(s) { return new TextEncoder().encode(s); }
function createZipBlob(files) {
  // files: [{name:string, content:string|Uint8Array}]
  var localParts=[], cdParts=[], offset=0, count=files.length;
  files.forEach(function(f){
    var nameBytes=_strToBytes(f.name);
    var contentBytes=typeof f.content==='string'?_strToBytes(f.content):f.content;
    var crc=_crc32(contentBytes);
    var lh=new ArrayBuffer(30+nameBytes.length);
    var lv=new DataView(lh);
    lv.setUint32(0,0x04034b50,true);
    lv.setUint16(4,20,true);
    lv.setUint16(6,0x0800,true); // UTF-8 filename flag
    lv.setUint16(8,0,true);
    lv.setUint16(10,0,true);
    lv.setUint16(12,0x21,true); // dummy date
    lv.setUint32(14,crc,true);
    lv.setUint32(18,contentBytes.length,true);
    lv.setUint32(22,contentBytes.length,true);
    lv.setUint16(26,nameBytes.length,true);
    lv.setUint16(28,0,true);
    new Uint8Array(lh,30).set(nameBytes);
    localParts.push(new Uint8Array(lh), contentBytes);
    var cd=new ArrayBuffer(46+nameBytes.length);
    var cv=new DataView(cd);
    cv.setUint32(0,0x02014b50,true);
    cv.setUint16(4,20,true);
    cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true);
    cv.setUint16(10,0,true);
    cv.setUint16(12,0,true);
    cv.setUint16(14,0x21,true);
    cv.setUint32(16,crc,true);
    cv.setUint32(20,contentBytes.length,true);
    cv.setUint32(24,contentBytes.length,true);
    cv.setUint16(28,nameBytes.length,true);
    cv.setUint16(30,0,true);
    cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);
    cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);
    cv.setUint32(42,offset,true);
    new Uint8Array(cd,46).set(nameBytes);
    cdParts.push(new Uint8Array(cd));
    offset += 30+nameBytes.length+contentBytes.length;
  });
  var cdSize=cdParts.reduce(function(s,p){return s+p.length;},0);
  var eocd=new ArrayBuffer(22);
  var ev=new DataView(eocd);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(4,0,true); ev.setUint16(6,0,true);
  ev.setUint16(8,count,true); ev.setUint16(10,count,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  ev.setUint16(20,0,true);
  return new Blob(localParts.concat(cdParts, [new Uint8Array(eocd)]), {type:'application/zip'});
}
function downloadZip(files, zipName) {
  var blob=createZipBlob(files);
  var a=Object.assign(document.createElement('a'),{
    href:URL.createObjectURL(blob),
    download:zipName
  });
  a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

    alert('拠点が登録されていないため、「全データのバックアップ」と同じになります。');

function importBackup(ev) {
  const file=ev.target.files[0]; if (!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try {
      const d=JSON.parse(e.target.result);
      if (!d.settings||!d.entries||!d.advances){ alert('無効なバックアップファイルです。'); return; }
      _pendingBackupData=d;
      showRestoreModeModal(d);
    } catch (e) { alert('ファイルの読み込みに失敗しました。'); }
  };
  reader.readAsText(file); ev.target.value='';
}

function executeFullOverwrite() {
  if (!_pendingBackupData) return;
  if (!confirm('現在のすべてのデータをバックアップで上書きします。\n他拠点のデータも消去されます。本当によろしいですか？')) return;
  const d=_pendingBackupData;
  DB.set('settings', d.settings);
  DB.set('entries', d.entries);
  DB.set('advances', d.advances);
  DB.set('reimbursements', d.reimbursements||[]);
  _pendingBackupData=null;
  closeModal();
  alert('データを復元しました。');
  initApp();
}

function executeLocationMerge() {
  if (!_pendingBackupData) return;
  const checks=document.querySelectorAll('#restore-loc-checks input[type=checkbox]:checked');
  const selectedLocs=Array.prototype.map.call(checks, function(c){return c.dataset.loc;});
  if (selectedLocs.length===0) { alert('取り込む拠点を1つ以上選択してください。'); return; }
  if (!confirm('選択した拠点（'+selectedLocs.join('、')+'）の現在データを、バックアップ内容で置き換えます。\nその他の拠点のデータはそのまま残ります。よろしいですか？')) return;
  mergeLocationBackup(_pendingBackupData, selectedLocs);
  _pendingBackupData=null;
  closeModal();
  alert('選択した拠点のデータをマージ復元しました：'+selectedLocs.join('、'));
  initApp();
}

function mergeLocationBackup(d, selectedLocs) {
  const locSet={};
  selectedLocs.forEach(function(l){ locSet[l]=true; });

  // 1) バックアップから選択拠点分を抽出
  const bEntries=(d.entries||[]).filter(function(e){return locSet[e.location||''];}).map(function(e){return Object.assign({},e);});
  const bAdvances=(d.advances||[]).filter(function(a){return locSet[a.location||''];}).map(function(a){return Object.assign({},a);});
  const bReims=(d.reimbursements||[]).filter(function(r){return locSet[r.location||''];}).map(function(r){return Object.assign({},r);});

  // 2) 現在データから選択拠点分を除外
  const curEntries=getEntries().filter(function(e){return !locSet[e.location||''];});
  const curAdvances=getAdvances().filter(function(a){return !locSet[a.location||''];});
  const curReims=getReimbursements().filter(function(r){return !locSet[r.location||''];});

  // 3) entry ID を採番し直し（衝突回避）
  var nextEntryNum=curEntries.reduce(function(m,e){return Math.max(m,parseInt(String(e.id||'').replace(/^E/,''))||0);},0)+1;
  const entryIdMap={};
  bEntries.forEach(function(e){
    const newId='E'+String(nextEntryNum++).padStart(4,'0');
    entryIdMap[e.id]=newId;
    e.id=newId;
  });

  // 4) advance ID を採番し直し（氏名スコープで連番）
  const advCounters={};
  curAdvances.forEach(function(a){
    const m=String(a.id||'').match(/^(.+)-(\d+)$/);
    if (m) advCounters[m[1]]=Math.max(advCounters[m[1]]||0, parseInt(m[2])||0);
  });
  const advIdMap={};
  bAdvances.forEach(function(a){
    const clean=(a.employeeName||'').replace(/\s+/g,'');
    advCounters[clean]=(advCounters[clean]||0)+1;
    const newId=clean+'-'+String(advCounters[clean]).padStart(3,'0');
    advIdMap[a.id]=newId;
    a.id=newId;
    if (a.cashEntryId)        a.cashEntryId=entryIdMap[a.cashEntryId]||null;
    if (a.settlementEntryId)  a.settlementEntryId=entryIdMap[a.settlementEntryId]||null;
    if (a.discrepancyEntryId) a.discrepancyEntryId=entryIdMap[a.discrepancyEntryId]||null;
  });

  // 5) reimbursement ID を採番し直し
  const reimCounters={};
  curReims.forEach(function(r){
    const m=String(r.id||'').match(/^R-(.+)-(\d+)$/);
    if (m) reimCounters[m[1]]=Math.max(reimCounters[m[1]]||0, parseInt(m[2])||0);
  });
  const reimIdMap={};
  bReims.forEach(function(r){
    const clean=(r.employeeName||'').replace(/\s+/g,'');
    reimCounters[clean]=(reimCounters[clean]||0)+1;
    const newId='R-'+clean+'-'+String(reimCounters[clean]).padStart(3,'0');
    reimIdMap[r.id]=newId;
    r.id=newId;
    if (r.reimbursementEntryId) r.reimbursementEntryId=entryIdMap[r.reimbursementEntryId]||null;
  });

  // 6) entry の advanceId / reimbursementId 参照を更新
  bEntries.forEach(function(e){
    if (e.advanceId && advIdMap[e.advanceId])           e.advanceId=advIdMap[e.advanceId];
    if (e.reimbursementId && reimIdMap[e.reimbursementId]) e.reimbursementId=reimIdMap[e.reimbursementId];
  });

  // 7) settings の locations と locationOpeningBalances をマージ
  const curSettings=getSettings()||{};
  const newSettings=Object.assign({}, curSettings);
  const curLocs=curSettings.locations||[];
  newSettings.locations=Array.from(new Set(curLocs.concat(selectedLocs)));
  newSettings.locationOpeningBalances=Object.assign({}, curSettings.locationOpeningBalances||{});
  const bLOB=(d.settings&&d.settings.locationOpeningBalances)||{};
  selectedLocs.forEach(function(loc){
    if (bLOB[loc]!=null) newSettings.locationOpeningBalances[loc]=bLOB[loc];
  });
  DB.set('settings', newSettings);

  // 8) 保存
  DB.set('entries', curEntries.concat(bEntries));
  DB.set('advances', curAdvances.concat(bAdvances));
  DB.set('reimbursements', curReims.concat(bReims));
}

// IndexedDB
function bankOpenDB() {
  if (_bankIDB) return Promise.resolve(_bankIDB);
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open('CashLedgerBankDB', 1);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('sessions'))
        db.createObjectStore('sessions', { keyPath: 'id' });
    };
    req.onsuccess = function(e) { _bankIDB = e.target.result; resolve(_bankIDB); };
    req.onerror = function(e) { reject(e); };
  });
}
function bankSaveSession(sess) {
  return bankOpenDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction('sessions','readwrite');
      tx.objectStore('sessions').put(sess);
      tx.oncomplete = resolve; tx.onerror = reject;
    });
  });
}
function bankLoadAllSessions() {
  return bankOpenDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction('sessions','readonly');
      var req = tx.objectStore('sessions').getAll();
      req.onsuccess = function() { resolve(req.result || []); };
      req.onerror = reject;
    });
  });
}
function bankDeleteSession(id) {
  return bankOpenDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction('sessions','readwrite');
      tx.objectStore('sessions').delete(id);
      tx.oncomplete = resolve; tx.onerror = reject;
    });
  });
}

// 文字コード自動検出
function bankDetectEncoding(buf) {
  var b = new Uint8Array(buf);
  if (b[0]===0xEF && b[1]===0xBB && b[2]===0xBF) return 'utf-8';
  if (b[0]===0xFF && b[1]===0xFE) return 'utf-16le';
  for (var i=0; i<Math.min(b.length-1,2000); i++) {
    if (b[i]===0x1B && (b[i+1]===0x24 || b[i+1]===0x28)) return 'iso-2022-jp';
  }
  var sjis=0, euc=0;
  for (var j=0; j<Math.min(b.length-1,3000); j++) {
    var c=b[j];
    if ((c>=0x81&&c<=0x9F)||(c>=0xE0&&c<=0xFC)) { sjis++; j++; }
    else if (c>=0xA1&&c<=0xFE) { if (b[j+1]>=0xA1&&b[j+1]<=0xFE) { euc++; j++; } }
  }
  if (sjis===0&&euc===0) return 'utf-8';
  return sjis>=euc ? 'shift_jis' : 'euc-jp';
}

// CSV解析
function bankParseCSV(text) {
  text = text.normalize('NFC').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var rows = [];
  var lines = text.split('\n');
  for (var li=0; li<lines.length; li++) {
    var line = lines[li];
    if (line.trim()==='') continue;
    var cells=[], i=0;
    while (i<line.length) {
      if (line[i]==='"') {
        var cell=''; i++;
        while (i<line.length) {
          if (line[i]==='"'&&line[i+1]==='"') { cell+='"'; i+=2; }
          else if (line[i]==='"') { i++; break; }
          else { cell+=line[i++]; }
        }
        cells.push(cell);
        if (line[i]===',') i++;
      } else {
        var end=line.indexOf(',',i);
        if (end===-1) { cells.push(line.slice(i)); i=line.length; }
        else { cells.push(line.slice(i,end)); i=end+1; }
      }
    }
    rows.push(cells);
  }
  return rows;
}

// 金額解析（括弧表記対応）
function bankParseAmount(str) {
  if (str==null||str==='') return 0;
  var s = String(str).replace(/[,，、]/g,'').replace(/¥/g,'').replace(/円/g,'').trim();
  if (!s) return 0;
  var neg=false;
  if (s.startsWith('(')&&s.endsWith(')')) { neg=true; s=s.slice(1,-1); }
  // 日本の銀行CSVで使われるマイナス記号: ▲ △ －(全角) －(MINUS SIGN)
  if (/^[▲△－−ー\-]/.test(s)) { neg=!neg; s=s.replace(/^[▲△－−ー\-]+/,''); }
  // 全角数字を半角に
  s = s.replace(/[０-９]/g, function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
  var n = parseFloat(s);
  if (isNaN(n)) return 0;
  return neg ? -n : n;
}

// 日付正規化
function bankNormalizeDate(str) {
  if (!str||!String(str).trim()) return '';
  var s = String(str).trim().replace(/[年月・\.]/g,'/').replace(/[日]/g,'').replace(/\s+/g,'');
  // 令和→西暦: R6/4/15 もしくは R6.4.15
  var rm = s.match(/^[RrＲｒ](\d{1,2})\/(\d{1,2})\/(\d{1,2})/);
  if (rm) {
    var yr = 2018 + parseInt(rm[1],10);
    return yr+'-'+rm[2].padStart(2,'0')+'-'+rm[3].padStart(2,'0');
  }
  // YYYYMMDD（8桁・区切り無し）
  var ymd = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (ymd) return ymd[1]+'-'+ymd[2]+'-'+ymd[3];
  var parts = s.split(/[\/\-]/);
  if (parts.length>=3) {
    var y = parts[0].length===2 ? '20'+parts[0] : parts[0];
    if (/^\d{4}$/.test(y) && /^\d{1,2}$/.test(parts[1]) && /^\d{1,2}$/.test(parts[2])) {
      return y+'-'+parts[1].padStart(2,'0')+'-'+parts[2].padStart(2,'0');
    }
  }
  if (parts.length===2) {
    var now=new Date();
    if (/^\d{1,2}$/.test(parts[0]) && /^\d{1,2}$/.test(parts[1])) {
      return now.getFullYear()+'-'+parts[0].padStart(2,'0')+'-'+parts[1].padStart(2,'0');
    }
  }
  return String(str);
}

// 日付文字列から YYYY-MM の月キーを抽出（YYYY-MM-DD / YYYY/MM/DD / YYYY.MM.DD / YYYYMMDD 等に対応）
function bankDateToMonthKey(d) {
  if (!d) return '';
  var s=String(d);
  // YYYY-MM, YYYY/MM, YYYY.MM (区切り有り)
  var dm=s.match(/^(\d{4})[\-\/\.](\d{1,2})/);
  if (dm) return dm[1]+'-'+String(dm[2]).padStart(2,'0');
  // YYYYMMDD（8桁）
  var ymd=s.match(/^(\d{4})(\d{2})\d{2}$/);
  if (ymd) return ymd[1]+'-'+ymd[2];
  // YYYYMM（6桁）
  var ym=s.match(/^(\d{4})(\d{2})$/);
  if (ym) return ym[1]+'-'+ym[2];
  return '';
}

function bankAccountKey(bankName, accountNo) {

function bankUpsertAccount(account) {
  if (!account||!account.bankName||!account.bankName.trim()) return;
  var arr=bankGetAccounts();
  var key=bankAccountKey(account.bankName, account.accountNo);
  var idx=arr.findIndex(function(a){return bankAccountKey(a.bankName, a.accountNo)===key;});
  if (idx>=0) {
    // 既存：空でない値だけ上書き（個別登録時に他フィールドを消さないため）
    var cur=arr[idx];
    ['branchName','accountType','holderName'].forEach(function(f){
      var v=(account[f]||'').trim();
      if (v) cur[f]=v;
    });
    cur.bankName=(account.bankName||'').trim();
    cur.accountNo=(account.accountNo||'').trim();
  } else {
    arr.push({
      bankName:(account.bankName||'').trim(),
      branchName:(account.branchName||'').trim(),
      accountType:(account.accountType||'').trim(),
      accountNo:(account.accountNo||'').trim(),
      holderName:(account.holderName||'').trim(),
      createdAt:new Date().toISOString()
    });
  }
  bankSaveAccounts(arr);
}
function bankRemoveAccount(idx) {
  var arr=bankGetAccounts();
  if (idx<0||idx>=arr.length) return;
  arr.splice(idx,1);
  bankSaveAccounts(arr);
}
function bankEnsureProcessedMonths(sess, force) {
  if (!sess) return sess;
  if (!force && sess.processedMonths && sess.processedMonths.length>0) return sess;
  var monthsSet={};
  (sess.rows||[]).forEach(function(r){
    if (!bankIsCountableRow(r)) return; // 繰越行は処理月から除外
    var mk=bankDateToMonthKey(r.date);
    if (mk) monthsSet[mk]=true;
  });
  var months=Object.keys(monthsSet).sort();
  sess.processedMonths=months;
  sess.firstProcessedMonth=months[0]||null;
  sess.lastProcessedMonth=months[months.length-1]||null;
  return sess;
}

function bankGetAccountProgress(bankName, accountNo) {
  var key=bankAccountKey(bankName, accountNo);
  var sessions=(bankSessionCache||[]).filter(function(s){
    return bankAccountKey(s.bankName, s.accountNo)===key;
  });
  var completed=sessions.filter(function(s){return s.completed;});
  var ongoing=sessions.filter(function(s){return !s.completed;});
  var lastMonth=null;
  completed.forEach(function(s){
    bankEnsureProcessedMonths(s);
    if (s.lastProcessedMonth && (lastMonth===null||s.lastProcessedMonth>lastMonth)) {
      lastMonth=s.lastProcessedMonth;
    }
  });
  return { lastProcessedMonth:lastMonth, ongoingCount:ongoing.length, completedCount:completed.length };
}
function bankFormatMonth(yyyymm) {
  if (!yyyymm) return '';
  var m=String(yyyymm).match(/^(\d{4})-(\d{2})$/);
  return m ? m[1]+'年'+parseInt(m[2],10)+'月' : yyyymm;
}
function bankFormatMonthShort(yyyymm) {
  if (!yyyymm) return '';
  var m=String(yyyymm).match(/^\d{4}-(\d{2})$/);
  return m ? parseInt(m[1],10)+'月分' : yyyymm;
}
function bankComputeFiscalYearMonths(fm, fyYear) {
  var months=[];
  fm=parseInt(fm)||1;
  for (var i=0;i<12;i++) {
    var offset=fm-1+i;
    var monthNum=(offset%12)+1;
    var year=fyYear+Math.floor(offset/12);
    months.push({
      year:year,
      month:monthNum,
      key:year+'-'+String(monthNum).padStart(2,'0')
    });
  }
  return months;
}
function bankGetProcessedMonthsSet(bankName, accountNo) {
  var key=bankAccountKey(bankName, accountNo);
  var sessions=(bankSessionCache||[]).filter(function(s){
    return bankAccountKey(s.bankName, s.accountNo)===key && s.completed;
  });
  var set={};
  sessions.forEach(function(s){
    bankEnsureProcessedMonths(s);
    (s.processedMonths||[]).forEach(function(m){ set[m]=true; });
  });
  return set;
}
function bankSessionCoversMonth(sess, monthKey) {
  if (!sess) return false;
  bankEnsureProcessedMonths(sess);
  if ((sess.processedMonths||[]).indexOf(monthKey)!==-1) return true;
  // Fallback: 行を直接スキャン（processedMonths が古い形式で取りこぼした場合）
  return (sess.rows||[]).some(function(r){
    if (!bankIsCountableRow(r)) return false; // 繰越行は除外
    return bankDateToMonthKey(r.date)===monthKey;
  });
}
function bankFindSessionForMonth(bankName, accountNo, year, month) {
  var monthKey=year+'-'+String(month).padStart(2,'0');
  var key=bankAccountKey(bankName, accountNo);
  var sessions=(bankSessionCache||[]).filter(function(s){
    if (bankAccountKey(s.bankName, s.accountNo)!==key) return false;
    return bankSessionCoversMonth(s, monthKey);
  });
  var completed=sessions.filter(function(s){return s.completed;});
  var ongoing=sessions.filter(function(s){return !s.completed;});
  if (completed.length>0) {
    completed.sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'');});
    return { session:completed[0], status:'completed' };
  }
  if (ongoing.length>0) {
    ongoing.sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'');});
    return { session:ongoing[0], status:'editing' };
  }
  return { session:null, status:'none' };
}

// セッションの主たる会計年度（最初の処理対象月から算出）
function bankSessionPrimaryFy(sess) {
  if (!sess) return null;
  var m=sess.firstProcessedMonth;
  if (!m) {
    // 念のため processedMonths からも探す
    var months=(sess.processedMonths||[]).slice().sort();
    m=months[0];
  }
  if (!m) return null;
  return getFiscalYearForDate(String(m)+'-01');
}

// 繰越（前月繰越・前期繰越・開始残高など）行の判定。
// 通帳CSVの先頭やページ境界に出現し、入出金が無く残高のみが入っている行。
// これらは「取引」ではないため、処理対象月や会計年度の判定からは除外する。
function bankIsCarryoverRow(r) {
  if (!r) return false;
  if (Number(r.receipt||0)!==0 || Number(r.payment||0)!==0) return false;
  var orig=String((r.descriptionOriginal!=null?r.descriptionOriginal:r.description)||'').trim();
  if (!orig) return false;
  // 「繰越」「繰り越し」「前月繰越」「前期繰越」「開始残高」「前残」など
  return /繰越|繰り越し|前残|前月残|前期残|開始残高|期首残|キソウザン|ｷｿｳｻﾞﾝ|くりこし|クリコシ|ｸﾘｺｼ/.test(orig);
}

// 月別進捗・年度判定の対象とする行か（繰越行は除外）
function bankIsCountableRow(r) {
  return !!r && !bankIsCarryoverRow(r);
}

// セッションマージ（同銀行・同口座の重複排除）
function bankRowDedupKey(r) {
  return (r.date||'')+'|'+String(r.descriptionOriginal||'').trim()+'|'+(r.receipt||0)+'|'+(r.payment||0)+'|'+(r.balance||0);
}

function bankMergeSessions(base, other, batchId) {
  var seen=new Set(base.rows.map(bankRowDedupKey));
  var added=0, dup=0;
  other.rows.forEach(function(r) {
    var k=bankRowDedupKey(r);
    if (!seen.has(k)) {
      if (batchId && !r.batchId) r.batchId=batchId;
      base.rows.push(r); seen.add(k); added++;
    } else {
      dup++;
    }
  });
  base.rows.sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
  // 処理対象月を再計算（繰越行は除外）
  var monthsSet={};
  base.rows.forEach(function(r){
    if (!bankIsCountableRow(r)) return;
    var mk=bankDateToMonthKey(r.date);
    if (mk) monthsSet[mk]=true;
  });
  var months=Object.keys(monthsSet).sort();
  base.processedMonths=months;
  base.firstProcessedMonth=months[0]||null;
  base.lastProcessedMonth=months[months.length-1]||null;
  return { added:added, duplicates:dup };
}

function bankRemoveImportBatch(sess, batchId) {
  if (!sess||!batchId) return 0;
  var before=sess.rows.length;
  sess.rows=sess.rows.filter(function(r){return r.batchId!==batchId;});
  var removed=before-sess.rows.length;
  if (sess.imports) sess.imports=sess.imports.filter(function(im){return im.batchId!==batchId;});
  bankEnsureProcessedMonths(sess, true);
  return removed;
}

function bankDeleteImportBatch(batchId) {
  if (!bankCurrentSession||!batchId) return;
  var im=(bankCurrentSession.imports||[]).find(function(x){return x.batchId===batchId;});
  if (!im) { alert('該当する取込履歴が見つかりません。'); return; }
  var rowCount=bankCurrentSession.rows.filter(function(r){return r.batchId===batchId;}).length;
  if (!confirm('この取込（'+(im.fileName||'')+'）を削除します。\n対象 '+rowCount+' 行が消去されます（列マッピング誤りの取り消し用）。\n\nよろしいですか？')) return;
  bankRemoveImportBatch(bankCurrentSession, batchId);
  if (bankCurrentSession.rows.length===0) {
    // 全行なくなったらセッション自体を削除
    if (confirm('このセッションには行が残っていません。\nセッションごと削除しますか？')) {
      bankDeleteSession(bankCurrentSession.id).then(function(){
        if (bankSessionCache) {
          bankSessionCache=bankSessionCache.filter(function(s){return s.id!==bankCurrentSession.id;});
        }
        bankCurrentSession=null;
        bankCsvPage='list';
        renderPage();
      });
      return;
    }
  }
  bankCurrentSession.updatedAt=new Date().toISOString();
  bankSaveSession(bankCurrentSession).then(function(){
    if (bankSessionCache) {
      var idx=bankSessionCache.findIndex(function(s){return s.id===bankCurrentSession.id;});
      if (idx>=0) bankSessionCache[idx]=bankCurrentSession;
    }
    renderPage();
  });
}

function bankOnDrop(event) {
  event.preventDefault();
  var dz=document.getElementById('bank-drop-zone');
  if (dz) dz.classList.remove('drag-over');

  if (file) bankReadFile(file);
}
function bankOnFileSelect(event) {
  var file=event.target.files[0];
  if (file) bankReadFile(file);
  event.target.value='';
}
function bankReadFile(file) {
  var reader=new FileReader();
  reader.onload=function(e) {
    var buf=e.target.result;
    var enc=bankDetectEncoding(buf);
    var text;
    try { text=new TextDecoder(enc,{fatal:false}).decode(buf); }
    catch(ex) { text=new TextDecoder('utf-8',{fatal:false}).decode(buf); }
    if (text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    var parsed=bankParseCSV(text);
    if (parsed.length<2) { alert('CSVの解析に失敗しました。ファイルを確認してください。'); return; }
    var hdrIdx=bankFindBestHeaderRow(parsed);
    var headerRow=parsed[hdrIdx]||parsed[0];
    var hdrLen=headerRow.length;
    // ページ境界等で同じヘッダー/プリアンブルが本文中に再出現するCSVに対応:
    // ・ヘッダー語（年月日/摘要/残高...）を多く含む行 → 継続ヘッダーとしてスキップ
    // ・口座情報語（銀行名/口座番号/支店名/期間F/期間T）を含む行 → プリアンブルとしてスキップ
    // ・継続ヘッダー直前の数行（通常は銀行情報/期間行）も合わせてスキップ
    var headerKw=['年月日','取引日','日付','摘要','内容','取引内容','残高','差引残高','差引'];
    var preambleKw=['銀行名','口座情報','口座番号','支店名','支店コード','取引期間','期間From','期間To','期間Ｆ','期間Ｔ'];
    function rowKwScore(row, kws){
      if (!row) return 0;
      // 全角英数字を半角に正規化してから判定（「期間Ｆｒｏｍ」「期間Ｔｏ」等の銀行CSVに対応）
      var t=row.map(function(c){
        var s=(c||'').trim();
        return s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(ch){
          return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);
        });
      }).join('|');
      var n=0;
      for (var ki=0; ki<kws.length; ki++) {
        var kw=kws[ki].replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(ch){
          return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);
        });
        if (t.indexOf(kw)!==-1) n++;
      }
      return n;
    }
    var continuationHeaderIdxs=[];
    for (var pi=hdrIdx+1; pi<parsed.length; pi++) {
      if (rowKwScore(parsed[pi], headerKw) >= 2) continuationHeaderIdxs.push(pi);
    }
    var bankSkipSet={};
    continuationHeaderIdxs.forEach(function(ci){
      bankSkipSet[ci]=true;
      // 継続ヘッダー直前の最大2行（プリアンブル）も合わせてスキップ
      for (var d=1; d<=2; d++) {
        var bi=ci-d;
        if (bi>hdrIdx) bankSkipSet[bi]=true;
      }
    });
    // プリアンブル語を含む行は位置に関わらず全てスキップ
    for (var pi2=hdrIdx+1; pi2<parsed.length; pi2++) {
      if (bankSkipSet[pi2]) continue;
      if (rowKwScore(parsed[pi2], preambleKw) >= 1) bankSkipSet[pi2]=true;
    }
    bankImportedData={
      fileName:file.name, encoding:enc,
      headers:headerRow,
      preambleRowCount:hdrIdx,
      rows:parsed.slice(hdrIdx+1).filter(function(r, ri){
        var absIdx=hdrIdx+1+ri;
        if (bankSkipSet[absIdx]) return false;
        if (!r.some(function(c){return (c||'').trim()!=='';})) return false;
        return r.length>=Math.max(3, Math.floor(hdrLen/2));
      })
    };
    bankColumnRoles={description:[]};
    bankActiveRole=null;
    // bankNameCache / bankAcctCache は意図的に保持
    // （口座マスタカードクリックや銀行プロファイル選択で事前入力された値を維持する）
    bankAutoDetectColumns(bankImportedData.headers);
    // 既存プロファイルがあれば列マッピングを自動復元
    if (bankNameCache && bankAcctCache!=null) {
      var profiles=bankGetProfiles();
      var key=bankProfileKey(bankNameCache, bankAcctCache);
      var p=profiles.find(function(pp){return bankProfileKey(pp.bankName, pp.accountNo)===key;});
      if (p) {
        var roles=Object.assign({}, p.roles||{});
        if (typeof roles.description==='number') roles.description=[roles.description];
        if (!Array.isArray(roles.description)) roles.description=[];
        // 新CSVの列数の範囲内かを検証
        var maxIdx=bankImportedData.headers.length-1;
        var allValid=true;
        ['date','receipt','payment','amount','balance'].forEach(function(r){
          if (roles[r]!=null && (roles[r]<0||roles[r]>maxIdx)) allValid=false;
        });
        (roles.description||[]).forEach(function(i){ if (i<0||i>maxIdx) allValid=false; });
        if (allValid) bankColumnRoles=roles;
      }
    }
    bankCsvPage='mapping';
    renderPage();
  };
  reader.readAsArrayBuffer(file);
}

function bankAutoDetectColumns(headers) {
  var dateKw  =['日付','DATE','取引日','年月日','取引年月日','Value Date'];
  var descKw  =['摘要','内容','取引内容','取引摘要','説明','Description'];
  var recKw   =['入金','入金額','入金金額','受入','受入金額','預入','預入金額','お預かり','預金','Deposit','Credit'];
  var payKw   =['出金','出金額','出金金額','支払','支払金額','お引き出し','引出','引落','引落額','Withdrawal','Debit'];
  var amtKw   =['金額','取引金額','収支','差引','差額','入出金','取引額','Amount'];
  var balKw   =['残高','差引残高','帳尻','Balance'];
  function match(h,kws) {
    var hu=h.trim().toUpperCase();
    return kws.some(function(k){return hu.indexOf(k.toUpperCase())!==-1;});
  }
  if (!Array.isArray(bankColumnRoles.description)) bankColumnRoles.description=[];
  headers.forEach(function(h,i) {
    if (bankColumnRoles.date==null && match(h,dateKw))         bankColumnRoles.date=i;
    else if (bankColumnRoles.description.length===0 && match(h,descKw)) bankColumnRoles.description=[i];
    else if (bankColumnRoles.balance==null && match(h,balKw))  bankColumnRoles.balance=i;
    else if (bankColumnRoles.receipt==null && match(h,recKw))  bankColumnRoles.receipt=i;
    else if (bankColumnRoles.payment==null && match(h,payKw))  bankColumnRoles.payment=i;
    else if (bankColumnRoles.amount==null
             && bankColumnRoles.receipt==null && bankColumnRoles.payment==null
             && match(h,amtKw))  bankColumnRoles.amount=i;
  });
}

// CSVの上部に口座番号・期間などのプリアンブル行がある場合に
// 実際の取引列ヘッダー行を見つけて、その行をヘッダーとして扱う。
function bankFindBestHeaderRow(parsed) {
  var keywords=['日付','年月日','取引日','摘要','内容','取引内容','入金','受入','預入','預金','出金','支払','引出','引落','残高','差引'];
  var best={idx:0, score:0, len:0};
  var limit=Math.min(parsed.length, 12);
  for (var i=0;i<limit;i++) {
    var row=parsed[i];
    if (!row||row.length<3) continue;
    var rowText=row.map(function(c){return (c||'').trim();}).filter(function(c){return c;}).join('|');
    if (!rowText) continue;
    var score=0;
    keywords.forEach(function(k){ if (rowText.indexOf(k)!==-1) score++; });
    if (score>best.score || (score===best.score && row.length>best.len)) {
      best={idx:i, score:score, len:row.length};
    }
  }
  return best.score>=2 ? best.idx : 0;
}

function bankNormalizeColumnRoles() {
  if (!bankColumnRoles || typeof bankColumnRoles!=='object') bankColumnRoles={};
  if (typeof bankColumnRoles.description==='number') bankColumnRoles.description=[bankColumnRoles.description];
  if (!Array.isArray(bankColumnRoles.description)) bankColumnRoles.description=[];
}
function bankGetRoleForCol(colIdx) {
  if (bankColumnRoles.date===colIdx) return 'date';
  if (bankColumnRoles.receipt===colIdx) return 'receipt';
  if (bankColumnRoles.payment===colIdx) return 'payment';
  if (bankColumnRoles.amount===colIdx) return 'amount';
  if (bankColumnRoles.balance===colIdx) return 'balance';
  if ((bankColumnRoles.description||[]).indexOf(colIdx)>=0) return 'description';
  return null;
}
function bankCacheMappingInputs() {
  var n=document.getElementById('bank-name-input');
  var a=document.getElementById('bank-acct-input');
  if (n) bankNameCache=n.value;
  if (a) bankAcctCache=a.value;
}
function bankSetActiveRole(role) {
  bankCacheMappingInputs();
  bankActiveRole=(bankActiveRole===role)?null:role;
  renderPage();
}
function bankAssignRole(colIdx) {
  bankCacheMappingInputs();
  bankNormalizeColumnRoles();
  if (!bankActiveRole) {
    alert('まず上の役割ボタン（日付/摘要/入金/出金/入出金(±)/残高/解除）を選んでから、CSVの列ヘッダーをクリックしてください。');
    return;
  }
  var SINGLE_ROLES=['date','receipt','payment','amount','balance'];
  function clearFromAllRoles(idx) {
    SINGLE_ROLES.forEach(function(r){ if (bankColumnRoles[r]===idx) delete bankColumnRoles[r]; });
    bankColumnRoles.description=bankColumnRoles.description.filter(function(i){return i!==idx;});
  }
  if (bankActiveRole==='clear') {
    clearFromAllRoles(colIdx);
  } else if (bankActiveRole==='description') {
    var arr=bankColumnRoles.description.slice();
    var pos=arr.indexOf(colIdx);
    if (pos>=0) {
      arr.splice(pos,1);
    } else {
      SINGLE_ROLES.forEach(function(r){ if (bankColumnRoles[r]===colIdx) delete bankColumnRoles[r]; });
      arr.push(colIdx);
      arr.sort(function(a,b){return a-b;});
    }
    bankColumnRoles.description=arr;
  } else {
    clearFromAllRoles(colIdx);
    // 入出金(±)を選ぶときは入金/出金を解除、逆も
    if (bankActiveRole==='amount') {
      delete bankColumnRoles.receipt;
      delete bankColumnRoles.payment;
    } else if (bankActiveRole==='receipt' || bankActiveRole==='payment') {
      delete bankColumnRoles.amount;
    }
    bankColumnRoles[bankActiveRole]=colIdx;
  }
  renderPage();
}

let _bankPendingImport=null;

function bankStartEditing() {
  if (!bankImportedData) return;
  bankNormalizeColumnRoles();
  var bankName=(document.getElementById('bank-name-input')||{value:bankNameCache}).value.trim();
  var accountNo=(document.getElementById('bank-acct-input')||{value:bankAcctCache}).value.trim();
  var descCols=bankColumnRoles.description||[];
  var batchId='batch_'+Date.now();
  // 1) 各行を変換（順序非依存処理）
  var rows=bankImportedData.rows.map(function(row) {
    var dateStr=bankColumnRoles.date!=null?bankNormalizeDate(row[bankColumnRoles.date]||''):'';
    var descOrig=descCols.map(function(c){return (row[c]||'').trim();}).filter(function(s){return s;}).join(' ');
    var rec=bankColumnRoles.receipt!=null?bankParseAmount(row[bankColumnRoles.receipt]):0;
    var pay=bankColumnRoles.payment!=null?bankParseAmount(row[bankColumnRoles.payment]):0;
    if (bankColumnRoles.amount!=null) {
      var amt=bankParseAmount(row[bankColumnRoles.amount]);
      if (amt>0) rec=amt;
      else if (amt<0) pay=-amt;
    }
    var bal=bankColumnRoles.balance!=null?bankParseAmount(row[bankColumnRoles.balance]):0;
    var probe={descriptionOriginal:descOrig, receipt:rec, payment:pay};
    var initDesc=(bankClassifyRow(probe)==='needsInfo')?'':descOrig;
    // 日付が「YYYY-MM-DD」形式に正規化できなかった場合は空とみなす
    // （プリアンブル残骸の口座番号などが date 列に紛れ込むのを防ぐ）
    var normalized=/^\d{4}-\d{2}-\d{2}$/.test(dateStr);
    return {
      date: normalized ? dateStr : '',
      descriptionOriginal:descOrig, description:initDesc,
      receipt:rec, payment:pay, balance:bal, batchId:batchId
    };
  });
  // 2) 内容が空のプレースホルダ行を先に除去
  //    （摘要・入出金・残高がすべて空の行は、その後の「日付継承」対象にしない）
  rows=rows.filter(function(r){
    if ((r.descriptionOriginal||'').trim()) return true;
    if (r.receipt!==0 || r.payment!==0 || r.balance!==0) return true;
    return false;
  });
  // 3) 日付が空白の行は直前の行から継承
  //    （銀行CSVが「上のセルと同じ日付の場合は空欄」とする仕様への対応）
  var lastDate='';
  rows.forEach(function(r){
    if (r.date) lastDate=r.date;
    else if (lastDate) r.date=lastDate;
  });
  // 4) 繰越行を検出してマーキング（処理月・年度判定から除外する印）
  rows.forEach(function(r){
    if (bankIsCarryoverRow(r)) r.isCarryover=true;
  });
  // 5) 日付順に整列
  rows.sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});

  // === 年度ミスマッチ検出（繰越行は除外。前月末日の繰越行で誤判定されないようにする） ===
  var rowFys={};
  rows.forEach(function(r){
    if (!bankIsCountableRow(r)) return;
    var fy=getFiscalYearForDate(r.date);
    if (fy!=null) rowFys[fy]=(rowFys[fy]||0)+1;
  });
  var rowFyList=Object.keys(rowFys).map(Number).sort(function(a,b){return a-b;});
  if (rowFyList.length>0 && rowFyList.indexOf(ledgerYear)===-1) {
    _bankPendingImport={
      bankName:bankName, accountNo:accountNo,
      batchId:batchId, rows:rows,
      fileName:bankImportedData.fileName||'',
      columnMapping:Object.assign({},bankColumnRoles),
      headers:bankImportedData.headers
    };
    bankShowYearMismatchDialog(rowFyList, rowFys);
    return;
  }

  bankFinalizeImport(bankName, accountNo, batchId, rows);
}

function bankFinalizeImport(bankName, accountNo, batchId, rows) {
  if (bankName) {
    bankUpsertProfile(bankName, accountNo, bankColumnRoles);
    bankUpsertAccount({bankName:bankName, accountNo:accountNo});
  }
  var importLog={
    batchId:batchId,
    importedAt:new Date().toISOString(),
    fileName:(bankImportedData&&bankImportedData.fileName)||(_bankPendingImport&&_bankPendingImport.fileName)||'',
    rowCount:rows.length,
    columnMapping:Object.assign({}, bankColumnRoles)
  };
  // 既存セッションがあれば自動マージ＋重複排除
  var existing=null;
  if (bankSessionCache&&bankName) {
    existing=bankSessionCache.find(function(s){return s.bankName===bankName&&s.accountNo===accountNo;});
  }
  if (existing) {
    var mergeResult=bankMergeSessions(existing, {rows:rows}, batchId);
    existing.updatedAt=new Date().toISOString();
    existing.imports=(existing.imports||[]).concat([Object.assign({}, importLog, {addedRows:mergeResult.added, duplicateRows:mergeResult.duplicates})]);
    existing.completed=false;
    bankCurrentSession=existing;
    bankEditFilter='attention';bankCsvPage='editing';
    bankSaveSession(existing).then(function(){
      var msg='【自動マージ】'+rows.length+'行を取り込みました。\n　 新規追加: '+mergeResult.added+'行\n　 重複（取込済）: '+mergeResult.duplicates+'行';
      if (mergeResult.duplicates>0) alert(msg);
      renderPage();
    });
    return;
  }

  var monthsSet={};
  rows.forEach(function(r){
    if (!bankIsCountableRow(r)) return; // 繰越行は処理月から除外
    var mk=bankDateToMonthKey(r.date);
    if (mk) monthsSet[mk]=true;
  });
  var months=Object.keys(monthsSet).sort();
  var sess={
    id:'bank_'+Date.now(),
    bankName:bankName, accountNo:accountNo,
    fileName:(bankImportedData&&bankImportedData.fileName)||(_bankPendingImport&&_bankPendingImport.fileName)||'',
    originalHeaders:(bankImportedData&&bankImportedData.headers)||(_bankPendingImport&&_bankPendingImport.headers)||[],
    columnMapping:Object.assign({},bankColumnRoles),
    rows:rows,
    imports:[importLog],
    processedMonths:months,
    firstProcessedMonth:months[0]||null,
    lastProcessedMonth:months[months.length-1]||null,
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };
  bankCurrentSession=sess;
  if (!bankSessionCache) bankSessionCache=[];
  bankSessionCache.unshift(sess);
  bankSaveSession(sess);
  bankEditFilter='attention';bankCsvPage='editing';
  renderPage();
}

function bankResumeSession(id) {
  var sess=(bankSessionCache||[]).find(function(s){return s.id===id;});
  if (sess) { bankCurrentSession=sess; bankEditFilter='attention';bankCsvPage='editing'; renderPage(); return; }
  bankOpenDB().then(function(db){
    var tx=db.transaction('sessions','readonly');
    var req=tx.objectStore('sessions').get(id);
    req.onsuccess=function(){
      if (req.result){bankCurrentSession=req.result;bankEditFilter='attention';bankCsvPage='editing';renderPage();}
    };
  });
}
function bankConfirmDelete(id) {
  if (!confirm('このセッションを削除しますか？')) return;
  bankDeleteSession(id).then(function(){
    if (bankSessionCache) bankSessionCache=bankSessionCache.filter(function(s){return s.id!==id;});
    if (bankCurrentSession&&bankCurrentSession.id===id) bankCurrentSession=null;
    renderPage();
  });
}

var BANK_TRANSFER_DOC_KEYWORDS = ['振込資金','フリコミカワリキン','フリコミシキン','フリカエシキン','カワリキン','振替金','送金資金','フリコミシ'];
var BANK_GENERIC_DESC_PATTERNS = ['AD','D','CD','ATM','預金機','カード','カードAD','カードD','機械','現金'];
var BANK_LOAN_KEYWORDS = ['借入','借り入れ','借入金','ローン','融資','金消','金銭消費貸借','手形貸付','手形借入','手貸','ﾃｶﾞﾀｶｼﾂｹ','ﾃｶﾞﾀｶﾘｲﾚ','当座貸越','当貸','証書貸付','ｶﾘｲﾚ','ｶﾘｲﾚｷﾝ','ｶﾘｲﾚｷﾝｺｳﾆｭｳ','カリイレ','カリイレキン','LOAN'];
var BANK_AUTO_KEYWORDS = ['トヨタ','ﾄﾖﾀ','ホンダ','ﾎﾝﾀﾞ','日産','ﾆｯｻﾝ','ニッサン','マツダ','ﾏﾂﾀﾞ','スバル','ｽﾊﾞﾙ','スズキ','ｽｽﾞｷ','ダイハツ','ﾀﾞｲﾊﾂ','レクサス','ﾚｸｻｽ','三菱自動車','ｶｰﾃﾞｨｰﾗｰ','カーディーラー','自動車','ｼﾞﾄﾞｳｼﾔ','ｼﾞﾄﾞｳｼｬ','モータース','ﾓｰﾀｰｽ','ネッツ','ﾈｯﾂ','カローラ','ｶﾛｰﾗ','ＶＷ','VW','フォルクスワーゲン','BMW','ベンツ','ﾍﾞﾝﾂ','アウディ','ｱｳﾃﾞｨ','ポルシェ','ﾎﾟﾙｼｪ','カーリース','ｶｰﾘｰｽ','オートリース','ｵｰﾄﾘｰｽ','整備工場','板金','ｾｲﾋﾞ','ｶｰｼｮｯﾌﾟ','カーショップ','車検','ｼｬｹﾝ'];
var BANK_LOAN_RECEIPT_THRESHOLD = 1000000;

function bankClassifyByOrig(orig) {
  var s=(orig||'').trim();
  for (var i=0;i<BANK_TRANSFER_DOC_KEYWORDS.length;i++) {
    if (s.indexOf(BANK_TRANSFER_DOC_KEYWORDS[i])!==-1) return 'needsPDF';
  }
  if (!s) return 'needsInfo';
  var stripped=s.replace(/[\d\s\.\-\/:時分日年月()（）　,，。、]/g,'').trim();
  if (!stripped) return 'needsInfo';
  if (stripped.length<=2) return 'needsInfo';
  if (BANK_GENERIC_DESC_PATTERNS.indexOf(stripped)!==-1) return 'needsInfo';
  if (BANK_GENERIC_DESC_PATTERNS.indexOf(stripped.toUpperCase())!==-1) return 'needsInfo';
  return 'ok';
}
function bankClassifyOrig(orig) { return bankClassifyByOrig(orig); }

function bankClassifyRow(r) {
  if (!r) return 'ok';
  var receipt=Number(r.receipt||0);
  var payment=Number(r.payment||0);
  // 入出金が無い行（繰越・残高調整など）は対応不要
  if (receipt===0 && payment===0) return 'ok';
  var orig=(r.descriptionOriginal||'').trim();
  var base=bankClassifyByOrig(orig);
  if (base==='needsPDF') return 'needsPDF';
  if (base==='needsInfo') return 'needsInfo';
  // 高額入金＋借入関連 → 借入金書類(契約書等)
  if (receipt>=BANK_LOAN_RECEIPT_THRESHOLD) {
    for (var j=0;j<BANK_LOAN_KEYWORDS.length;j++) {
      if (orig.indexOf(BANK_LOAN_KEYWORDS[j])!==-1) return 'needsPDF';
    }
  }
  // 支払＋借入関連（手形貸付/証書貸付/ローン返済等）→ 返済予定表・利息計算書
  if (payment>0) {
    for (var lj=0;lj<BANK_LOAN_KEYWORDS.length;lj++) {
      if (orig.indexOf(BANK_LOAN_KEYWORDS[lj])!==-1) return 'needsPDF';
    }
  }
  if (payment>0) {
    for (var k=0;k<BANK_AUTO_KEYWORDS.length;k++) {
      if (orig.indexOf(BANK_AUTO_KEYWORDS[k])!==-1) return 'needsPDF';
    }
  }
  return 'ok';
}

function bankRowReason(r) {
  if (!r) return '';
  var orig=(r.descriptionOriginal||'').trim();
  for (var i=0;i<BANK_TRANSFER_DOC_KEYWORDS.length;i++) {
    if (orig.indexOf(BANK_TRANSFER_DOC_KEYWORDS[i])!==-1) return 'transfer';
  }
  if (Number(r.receipt||0)>=BANK_LOAN_RECEIPT_THRESHOLD) {
    for (var j=0;j<BANK_LOAN_KEYWORDS.length;j++) {
      if (orig.indexOf(BANK_LOAN_KEYWORDS[j])!==-1) return 'loan';
    }
  }
  if (Number(r.payment||0)>0) {
    for (var lj=0;lj<BANK_LOAN_KEYWORDS.length;lj++) {
      if (orig.indexOf(BANK_LOAN_KEYWORDS[lj])!==-1) return 'loan_repayment';
    }
    for (var k=0;k<BANK_AUTO_KEYWORDS.length;k++) {
      if (orig.indexOf(BANK_AUTO_KEYWORDS[k])!==-1) return 'auto';
    }
  }
  return orig?'generic':'empty';
}

function bankRowState(r) {
  var cls=bankClassifyRow(r);
  var desc=((r&&r.description)||'').trim();
  var orig=((r&&r.descriptionOriginal)||'').trim();
  if (cls==='needsInfo') {
    var hasNewDesc=desc.length>0 && desc!==orig;
    return hasNewDesc?'resolvedInfo':'needsInfo';
  }
  if (cls==='needsPDF') return 'needsPDF';
  return 'ok';
}
function bankRowClassName(state) {
  if (state==='needsInfo')    return 'bank-row-needinfo';
  if (state==='needsPDF')     return 'bank-row-needpdf';
  if (state==='resolvedInfo'||state==='resolvedPDF') return 'bank-row-resolved';
  return '';
}

function bankReasonBadge(state, reason, row) {
  // 繰越行（前月繰越・前期繰越など）は「処理不要・残高表示用」と明示する
  if (row && row.isCarryover) {
    return '<div class="bank-status-badge" style="background:#e0e7ff;color:#3730a3;border:1px solid #c7d2fe;">📘 繰越（残高表示・処理対象外）</div>';
  }
  if (state==='needsInfo') {
    var isReceipt=!!(row && Number(row.receipt||0)>0);
    var cls=isReceipt?'bank-status-needinfo-receipt':'bank-status-needinfo-payment';
    var label=isReceipt?'❗ 入金元の名称・内容を入力':'❗ 支払相手の名称・内容を入力';
    return '<div class="bank-status-badge '+cls+'">'+label+'</div>';
  }
  if (state==='resolvedInfo') return '<div class="bank-status-badge bank-status-resolved">✓ 入力済</div>';
  if (state==='resolvedPDF') return '<div class="bank-status-badge bank-status-resolved">✓ PDF送付済</div>';
  if (state==='needsPDF') {
    if (reason==='loan')           return '<div class="bank-status-badge bank-status-needpdf">📎 借入関連書類PDFを税理士へ送付</div>';
    if (reason==='loan_repayment') return '<div class="bank-status-badge bank-status-needpdf">📎 借入金返済予定表＋利息計算書を税理士へ送付</div>';
    if (reason==='auto')           return '<div class="bank-status-badge bank-status-needpdf">📎 この取引の請求書PDFを税理士へ送付</div>';
    return '<div class="bank-status-badge bank-status-needpdf">📎 振込明細PDFを税理士へ送付</div>';
  }
  return '';
}

function bankPageEdit() {
  if (!bankCurrentSession) { bankCsvPage='list'; bankSessionCache=null; return pageBankCSV(); }
  var sess=bankCurrentSession;
  var rows=sess.rows;
  var stateCounts={needsInfo:0, resolvedInfo:0, needsPDF:0, resolvedPDF:0, ok:0};
  var pdfReasonCounts={transfer:0, loan:0, auto:0};
  rows.forEach(function(r){
    var st=bankRowState(r);
    stateCounts[st]++;
    if (st==='needsPDF') {
      var rsn=bankRowReason(r);
      if (pdfReasonCounts[rsn]!=null) pdfReasonCounts[rsn]++;
    }
  });

  // needsPDF は「未対応」扱いせず、ユーザーへのお知らせとして扱う
  var attentionCount=stateCounts.needsInfo;
  var resolvedCount=stateCounts.resolvedInfo;
  var pdfCount=stateCounts.needsPDF;
  var showAttentionOnly=(bankEditFilter==='attention');

  var visibleRows=rows.map(function(r,i){return {r:r,i:i,state:bankRowState(r)};});
  if (showAttentionOnly) {
    visibleRows=visibleRows.filter(function(x){
      return x.state==='needsInfo'||x.state==='needsPDF'||x.state==='resolvedInfo'||x.state==='resolvedPDF';
    });
  }

  var tableRows=visibleRows.map(function(x) {
    var r=x.r, i=x.i, state=x.state;
    var reason=bankRowReason(r);
    var amount=Math.max(Math.abs(r.receipt||0),Math.abs(r.payment||0));
    var dayOfMonth=r.date?parseInt(r.date.split('-')[2])||0:0;
    var suggestions=bankAutoComplete(amount,dayOfMonth);

function bankToggleCompleted(completed) {
  if (!bankCurrentSession) return;
  if (completed) {
    // needsPDF はお知らせのみで「未対応」扱いしない
    var attn=bankCurrentSession.rows.filter(function(r){
      return bankRowState(r)==='needsInfo';
    }).length;
    if (attn>0) {
      if (!confirm('まだ相手先情報が未入力の行が '+attn+' 行あります（ピンク色の行）。\n本当に登録完了にしますか？')) return;
    }
  }
  bankCurrentSession.completed=!!completed;
  bankCurrentSession.completedAt=completed?new Date().toISOString():null;
  bankEnsureProcessedMonths(bankCurrentSession, true);
  bankSaveSession(bankCurrentSession).then(function(){
    if (bankSessionCache) {
      var idx=bankSessionCache.findIndex(function(s){return s.id===bankCurrentSession.id;});
      if (idx>=0) bankSessionCache[idx]=bankCurrentSession;
    }
    if (completed) {
      // セッションの処理月が現在表示中の会計年度に含まれない場合、
      // 自動的にセッションが属する会計年度へ切替（進捗バーの該当月が確実に点灯するようにする）。
      // 例: 4月始まり会計年度・現在FY2026表示中の状態で、4月CSV（FY2025データ）を取込→完了したケース。
      var sessFy=bankSessionPrimaryFy(bankCurrentSession);
      if (sessFy!=null && sessFy!==ledgerYear) {
        var months=(bankCurrentSession.processedMonths||[]).map(function(mk){
          return getFiscalYearForDate(mk+'-01');
        });
        // 現在年度に該当月が全く無い場合のみ切替
        if (months.indexOf(ledgerYear)===-1) {
          ledgerYear=sessFy;
          ledgerMonthFrom=0;
          ledgerMonthTo=0;
          if (typeof updateHeader==='function') updateHeader();
        }
      }
      // 登録完了したら一覧画面に戻り、月別進捗バーを更新表示
      bankCurrentSession=null;
      bankCsvPage='list';
      bankTargetMonth=null;
    }
    renderPage();
  });
}
function bankDescBlur(rowIdx, value) {
  if (!bankCurrentSession) return;
  bankCurrentSession.rows[rowIdx].description=value;
  if (value&&value.trim()) {
    var r=bankCurrentSession.rows[rowIdx];
    var amount=Math.max(Math.abs(r.receipt||0),Math.abs(r.payment||0));
    var day=r.date?parseInt(r.date.split('-')[2])||0:0;
    bankLearnHistory(value.trim(),amount,day);

    // 入金行で同じ元摘要を持つ未編集の他の入金行があれば一括変更を提案
    if (Number(r.receipt||0)>0 && r.descriptionOriginal) {
      var orig=String(r.descriptionOriginal||'').trim();
      var newVal=value.trim();
      var candidates=[];
      bankCurrentSession.rows.forEach(function(row,i){
        if (i===rowIdx) return;
        if (Number(row.receipt||0)<=0) return;
        if (String(row.descriptionOriginal||'').trim()!==orig) return;
        var rd=String(row.description||'').trim();
        // 未編集 (空 or 元摘要と同じ) のもののみ対象
        if (rd && rd!==orig) return;
        if (rd===newVal) return;
        candidates.push(i);
      });
      if (candidates.length>0) {
        if (confirm('同じ元摘要「'+orig+'」の入金行が他に '+candidates.length+' 件あります。\nそれらの修正後摘要も「'+newVal+'」に一括設定しますか？')) {
          candidates.forEach(function(i){
            bankCurrentSession.rows[i].description=newVal;
          });
          bankScheduleAutoSave();
          renderPage();
          return;
        }
      }
    }
  }
  bankScheduleAutoSave();
}

function bankShowMergeModal(groupKey) {
  var sessions=(bankSessionCache||[]).filter(function(s){
    return ((s.bankName||'')+'|'+(s.accountNo||''))===groupKey;
  });
  if (sessions.length<2) return;
  if (!confirm('以下のセッションをマージします（重複行は除去されます）:\n'+sessions.map(function(s){return (s.fileName||s.id)+' ('+s.rows.length+'行)';}).join('\n'))) return;
  var base=sessions[0];
  for (var i=1;i<sessions.length;i++) bankMergeSessions(base,sessions[i]);
  base.updatedAt=new Date().toISOString();
  bankSaveSession(base).then(function(){
    var deletePromises=sessions.slice(1).map(function(s){return bankDeleteSession(s.id);});
    return Promise.all(deletePromises);
  }).then(function(){
    bankSessionCache=null;
    renderPage();
  });
}

function renderSvgToPngBytes(svgStr, size) {
  return new Promise(function(resolve, reject) {
    var img = new Image();
    img.onload = function() {
      var c=document.createElement('canvas');
      c.width=size; c.height=size;
      var ctx=c.getContext('2d');
      ctx.clearRect(0,0,size,size);
      ctx.drawImage(img,0,0,size,size);
      c.toBlob(function(blob) {
        if (!blob) { reject(new Error('toBlob failed')); return; }
        blob.arrayBuffer().then(function(buf){ resolve(new Uint8Array(buf)); }, reject);
      }, 'image/png');
    };
    img.onerror=function(){ reject(new Error('SVG load failed')); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
  });
}

function buildIcoBlob(pngArr) {
  var count=pngArr.length;
  var headerSize=6+16*count;
  var total=headerSize+pngArr.reduce(function(s,p){return s+p.bytes.length;},0);
  var buf=new ArrayBuffer(total);
  var view=new DataView(buf);
  var bytes=new Uint8Array(buf);
  view.setUint16(0,0,true);     // reserved
  view.setUint16(2,1,true);     // type=ICO
  view.setUint16(4,count,true); // count
  var off=headerSize;
  pngArr.forEach(function(p,i){
    var eo=6+16*i;
    var s=p.size>=256?0:p.size;
    view.setUint8(eo,s);
    view.setUint8(eo+1,s);
    view.setUint8(eo+2,0);
    view.setUint8(eo+3,0);
    view.setUint16(eo+4,1,true);    // planes
    view.setUint16(eo+6,32,true);   // bitCount
    view.setUint32(eo+8,p.bytes.length,true);
    view.setUint32(eo+12,off,true);
    bytes.set(p.bytes,off);
    off+=p.bytes.length;
  });
  return new Blob([buf],{type:'image/vnd.microsoft.icon'});
}

function downloadAppIcon() {
  var svg=getAppIconSvgString();
  var sizes=[16,32,48,64,128,256];
  Promise.all(sizes.map(function(s){
    return renderSvgToPngBytes(svg,s).then(function(b){return {size:s,bytes:b};});
  })).then(function(pngs){
    var blob=buildIcoBlob(pngs);
    var a=Object.assign(document.createElement('a'),{
      href:URL.createObjectURL(blob),
      download:'現金出納帳.ico'
    });
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  }).catch(function(e){
    alert('アイコンの生成に失敗しました: '+(e&&e.message||e));
  });
}

function bankImportAccountsFile(event) {
  var file=event.target.files[0];
  if (!file) return;
  var reader=new FileReader();
  reader.onload=function(e) {
    var buf=e.target.result;
    var enc=bankDetectEncoding(buf);
    var text;
    try { text=new TextDecoder(enc,{fatal:false}).decode(buf); }
    catch (ex) { text=new TextDecoder('utf-8',{fatal:false}).decode(buf); }
    if (text.charCodeAt(0)===0xFEFF) text=text.slice(1);

    var parsed=bankParseCSV(text);
    if (parsed.length<2) {
      alert('CSVが空、もしくは形式が違います。テンプレートをご利用ください。');
      return;
    }
    var headers=parsed[0]||[];
    var bankIdx=headers.findIndex(function(h){return String(h||'').indexOf('銀行名')!==-1;});
    var acctIdx=headers.findIndex(function(h){return String(h||'').indexOf('口座番号')!==-1;});
    if (bankIdx===-1||acctIdx===-1) {
      alert('ヘッダ行に「銀行名」「口座番号」が見つかりません。\nテンプレートをご利用ください。');
      return;
    }
    var branchIdx=headers.findIndex(function(h){return String(h||'').indexOf('支店')!==-1;});
    var typeIdx=headers.findIndex(function(h){return String(h||'').indexOf('口座種別')!==-1||String(h||'').indexOf('種別')!==-1;});
    var holderIdx=headers.findIndex(function(h){return String(h||'').indexOf('名義')!==-1;});

    var accounts=[];
    for (var i=1;i<parsed.length;i++) {
      var row=parsed[i];
      if (!row||row.length===0) continue;
      if (row.every(function(c){return !(String(c||'').trim());})) continue;
      var bn=String(row[bankIdx]||'').trim();
      var an=String(row[acctIdx]||'').trim();
      if (!bn||!an) continue;
      accounts.push({
        bankName:bn,
        branchName:branchIdx>=0?String(row[branchIdx]||'').trim():'',
        accountType:typeIdx>=0?String(row[typeIdx]||'').trim():'',
        accountNo:an,
        holderName:holderIdx>=0?String(row[holderIdx]||'').trim():''
      });
    }
    if (accounts.length===0) {
      alert('有効なデータ行（銀行名と口座番号が両方入った行）が見つかりません。'); return;
    }
    showBankAccountsImportPreview(accounts);
  };
  reader.readAsArrayBuffer(file);
  event.target.value='';
}

    +'<div style="max-height:300px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:8px;">'
    +'<table style="width:100%;font-size:12px;border-collapse:collapse;">'

    +'<th style="padding:6px 8px;text-align:left;">区分</th>'
    +'<th style="padding:6px 8px;text-align:left;">銀行名</th>'
    +'<th style="padding:6px 8px;text-align:left;">支店</th>'
    +'<th style="padding:6px 8px;text-align:left;">種別</th>'
    +'<th style="padding:6px 8px;text-align:left;">口座番号</th>'
    +'<th style="padding:6px 8px;text-align:left;">名義</th>'
    +'</tr></thead><tbody>';
  accounts.forEach(function(a){
    var isUpd=existingKeys[bankAccountKey(a.bankName, a.accountNo)];
    html+='<tr style="border-top:1px solid var(--gray-200);">'
      +'<td style="padding:5px 8px;">'+(isUpd?'<span style="color:#d97706;font-weight:600;">上書</span>':'<span style="color:#059669;font-weight:600;">新規</span>')+'</td>'

      +'</tr>';
  });

  html+='<div style="font-size:11px;color:var(--gray-500);margin-top:8px;">※ 確定後、取り込んだCSVファイル自体はアプリ内に保存されません（容量を取らないため、データのみ登録します）。</div>';
  html+='<div class="modal-actions">'
    +'<button class="btn btn-secondary" onclick="_pendingBankAccountsImport=null;closeModal();showBankAccountsManager();">キャンセル</button>'
    +'<button class="btn btn-primary" onclick="bankConfirmImportAccounts()">'+accounts.length+'件を登録する</button>'
    +'</div>';

function bankConfirmImportAccounts() {
  if (!_pendingBankAccountsImport) return;
  var arr=bankGetAccounts();
  var keyToIdx={};
  arr.forEach(function(a,i){ keyToIdx[bankAccountKey(a.bankName, a.accountNo)]=i; });
  var added=0, updated=0;
  _pendingBankAccountsImport.forEach(function(a) {
    var key=bankAccountKey(a.bankName, a.accountNo);
    var rec={
      bankName:a.bankName, branchName:a.branchName, accountType:a.accountType,
      accountNo:a.accountNo, holderName:a.holderName
    };
    if (keyToIdx[key]!=null) {
      arr[keyToIdx[key]]=Object.assign({}, arr[keyToIdx[key]], rec);
      updated++;
    } else {
      rec.createdAt=new Date().toISOString();
      arr.push(rec);
      added++;
    }
  });
  bankSaveAccounts(arr);
  _pendingBankAccountsImport=null;
  closeModal();
  alert('銀行口座マスタを更新しました。\n新規追加: '+added+'件\n上書き: '+updated+'件\n\n取込元のCSVファイルはアプリ内に保存されていません。');
  showBankAccountsManager();
}
