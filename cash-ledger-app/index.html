function showAcctRowPicker(rowType, rowIndex, advId, advAmt, triggerEl) {
  const existing=document.getElementById('acct-row-popup');
  if (existing) { existing.remove(); return; }
  const rows=(rowType==='settle')?settleRows:reimburseRows;
  const current=(rows[rowIndex]&&rows[rowIndex].account)||'';
  const recent=getRecentAccounts();
  const popup=document.createElement('div');
  popup.id='acct-row-popup';
  popup.style.cssText='position:fixed;z-index:10000;background:white;border:1px solid var(--gray-300);border-radius:10px;padding:12px;width:320px;max-height:320px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.2);font-size:12px;';
  const rect=triggerEl.getBoundingClientRect();
  const top=Math.min(rect.bottom+4, window.innerHeight-340);
  const left=Math.min(rect.left, window.innerWidth-330);
  popup.style.top=top+'px'; popup.style.left=left+'px';
  const chipHtml=function(name){
    const sel=name===current;
    return '<div class="acct-chip'+(sel?' selected':'').replace(/'/g,"\\'")+'" onclick="applyAcctRowPicker(\''+rowType+'\','+rowIndex+',\''+encodeURIComponent(advId)+'\','+advAmt+',\''+encodeURIComponent(name)+'\')">'+esc(name)+'</div>';
  };
  let html='<div style="font-size:12px;font-weight:700;color:var(--gray-700);margin-bottom:8px;">勘定科目を選択</div>';
  if (current) html+='<div style="margin-bottom:8px;"><span style="font-size:11px;color:var(--gray-500);">現在: </span><span class="badge-acct">'+esc(current)+'</span> <button class="btn btn-xs btn-secondary" onclick="applyAcctRowPicker(\''+rowType+'\','+rowIndex+',\''+encodeURIComponent(advId)+'\','+advAmt+',\'\')">クリア</button></div>';
  if (recent.length>0) {
    html+='<div style="font-size:11px;color:var(--gray-500);margin-bottom:4px;">★ 最近</div><div class="acct-grid">'+recent.map(chipHtml).join('')+'</div>';
  }
  const rest=ACCOUNT_CATEGORIES.filter(function(n){return recent.indexOf(n)<0;});
  html+='<div style="font-size:11px;color:var(--gray-500);margin-top:8px;margin-bottom:4px;">全ての勘定科目</div><div class="acct-grid">'+rest.map(chipHtml).join('')+'</div>';
  popup.innerHTML=html;
  document.body.appendChild(popup);
  setTimeout(function(){
    function closePopup(e){ if (!popup.contains(e.target)&&e.target!==triggerEl){ popup.remove(); document.removeEventListener('click',closePopup); } }
    document.addEventListener('click',closePopup);
  },10);
}

function applyAcctRowPicker(rowType, rowIndex, advIdEnc, advAmt, acctEnc) {
  const advId=decodeURIComponent(advIdEnc);
  const acct=decodeURIComponent(acctEnc);
  const rows=(rowType==='settle')?settleRows:reimburseRows;
  if (rows[rowIndex]!=null) { rows[rowIndex].account=acct; if (acct) addRecentAccount(acct); }
  const popup=document.getElementById('acct-row-popup');
  if (popup) popup.remove();
  if (rowType==='settle') renderSettleRows(advId,advAmt);
  else if (rowType==='reim') renderReimRows();
  else if (rowType==='reimEdit') renderReimEditRows();
}

        </tr>`;}).join('')}

function addSettleRow(advId, advAmt) {
  settleRows.push({date:'',storeName:'',itemName:'',amount:'',account:''});
  renderSettleRows(advId, advAmt);
}

function removeSettleRow(i, advId, advAmt) {
  settleRows.splice(i,1);
  renderSettleRows(advId, advAmt);
}

function updateSettleSummary(advAmt) {
  const total=settleRows.reduce((s,r)=>s+Number((r.amount||'').toString().replace(/,/g,'')||0),0);
  const diff=total-advAmt;
  const el=document.getElementById('settle-summary');
  if (!el) return;
  let diffHtml='';
  if (total>0){
    if (diff>0)       diffHtml=`<span style="color:var(--danger);font-weight:700;"> → 不足額 ${fc(diff)}（追加払い）</span>`;
    else if (diff<0)  diffHtml=`<span style="color:var(--success);font-weight:700;"> → 期待返金額 ${fc(Math.abs(diff))}（返金受取）</span>`;
    else              diffHtml=`<span style="color:var(--primary);font-weight:700;"> → 過不足なし</span>`;
  }
  el.innerHTML=`合計使用金額: <strong class="mono">${fc(total)}</strong>　／　仮払金額: <strong class="mono">${fc(advAmt)}</strong>${diffHtml}`;

  const wrap = document.getElementById('actual-return-wrap');
  if (wrap) {
    const methodEl = document.getElementById('st-method');
    const isCash = methodEl ? methodEl.value === 'cash' : true;
    wrap.style.display = (diff < 0 && isCash) ? 'block' : 'none';
    if (diff < 0 && isCash) {
      const dispEl = document.getElementById('return-expected-display');
      if (dispEl) dispEl.textContent = '¥'+Math.abs(diff).toLocaleString('ja-JP');
    }
  }
}

function setActualReturnMode(differs) {
  var inputWrap = document.getElementById('actual-input-wrap');
  var okWrap = document.getElementById('actual-ok-wrap');
  var yesBtn = document.getElementById('return-yes-btn');
  var noBtn = document.getElementById('return-no-btn');
  if (inputWrap) inputWrap.style.display = differs ? 'block' : 'none';
  if (okWrap) okWrap.style.display = differs ? 'none' : 'block';
  if (yesBtn) {
    yesBtn.style.background = differs ? 'white' : '#16a34a';
    yesBtn.style.color = differs ? '#374151' : 'white';
    yesBtn.style.border = differs ? '2px solid #d1d5db' : '2px solid #16a34a';
  }
  if (noBtn) {
    noBtn.style.background = differs ? '#fef3c7' : 'white';
    noBtn.style.color = differs ? '#92400e' : '#374151';
    noBtn.style.border = differs ? '2px solid #fcd34d' : '2px solid #d1d5db';
  }
  if (!differs) {
    var actEl = document.getElementById('st-actual');
    if (actEl) actEl.value = '';
  }
}

function submitSettle(id, advAmt) {
  const settlementDate=readDateGroupMD('st-date');
  const settlementMethod=document.getElementById('st-method').value;
  if (!settlementDate){ alert('精算日を入力してください。'); return; }
  if (settleRows.every(r=>!r.amount&&!r.storeName&&!r.itemName)){
    alert('使用明細を1件以上入力してください。'); return;
  }
  const items=settleRows.map(r=>({...r,amount:Number((r.amount||'').toString().replace(/,/g,'')||0)}));
  items.forEach(function(it){ if(it.storeName) learnStore(it.storeName, it.account, null, it.itemName); });
  const actEl = document.getElementById('st-actual');
  const actStr = actEl ? (actEl.value||'').replace(/,/g,'').trim() : '';
  const actualReturn = actStr === '' ? null : Number(actStr);
  const adv = settleAdvance(id,{settlementDate,settlementMethod,items,actualReturn});
  closeModal(); updateHeader(); renderPage();

  if (adv) {
    const yen = function(n){ return '¥'+Number(n).toLocaleString('ja-JP'); };
    const ch = settlementMethod==='cash' ? '現金' : '振込';
    let msg = '✅ 精算を確定しました。\n\n';
    if (adv.expectedReturn > 0) {
      const receive = adv.actualReturn != null ? adv.actualReturn : adv.expectedReturn;
      msg += `📌 ${adv.employeeName} さんから ${ch}で ${yen(receive)} を受け取ってください。\n`;
      if (adv.discrepancy && adv.discrepancy !== 0) {
        msg += `（期待返金額: ${yen(adv.expectedReturn)}）\n\n`;
        if (adv.discrepancy > 0) {
          msg += `⚠️ 差額 ${yen(adv.discrepancy)}（不足分）は「現金過不足」として現金出納帳に自動計上されました。`;
        } else {
          msg += `⚠️ 差額 ${yen(Math.abs(adv.discrepancy))}（超過分）は「現金過不足」として現金出納帳に自動計上されました。`;
        }
      }
    } else if (adv.shortageAmount > 0) {
      msg += `📌 ${adv.employeeName} さんに ${ch}で ${yen(adv.shortageAmount)} を追加で支払ってください。`;
    } else {
      msg += `📌 仮払金額と使用金額が一致しています。過不足はありません。`;
    }
    alert(msg);
  }
}

function confirmDeleteEntry(id) {
  if (confirm('この取引を削除しますか？')){ removeEntry(id); updateHeader(); renderPage(); }
}

function confirmDeleteAdv(id) {
  const adv=getAdvances().find(a=>a.id===id);
  if (!adv) return;
  var msg;
  if (adv.status==='settled') {
    var parts=['・仮払い時の出金記録'];
    if (adv.settlementEntryId)  parts.push('・精算時の入金/出金記録');
    if (adv.discrepancyEntryId) parts.push('・現金過不足の記録');
    msg='この精算済の仮払い記録（'+adv.id+'）を削除しますか？\n\n以下の出納帳記録もまとめて削除されます：\n'+parts.join('\n')+'\n\n※ この操作は取り消せません。';
  } else {
    msg='この仮払い記録（'+adv.id+'）を削除しますか？\n関連する出納帳の出金記録も削除されます。';
  }
  if (confirm(msg)) {
    if (removeAdvance(id)) { updateHeader(); renderPage(); }
  }
}

function todayJP() {
  var d=new Date();
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}

          r.id, idx===0?r.registeredDate:'', idx===0?r.employeeName:'', idx===0?(r.purpose||''):'',

        ]);

  });

  // 6. 銀行出納帳（IndexedDBから全セッション）
  bankLoadAllSessions().then(function(sessions) {

    sessions.forEach(function(sess) {

        ['銀行出納帳', sess.bankName||'', (sess.accountNo?'口座番号:'+sess.accountNo:''), '出力日:'+today()],
        ['日付','摘要','入金','出金','残高']
      ];
      (sess.rows||[]).forEach(function(r){
        rows.push([
          r.date||'',
          r.description||'',
          r.receipt>0?r.receipt:'',
          r.payment>0?r.payment:'',
          r.balance!==0?r.balance:''
        ]);
      });
      var safe=function(s){return (s||'').replace(/[\\/:*?"<>|]/g,'_');};
      var fname='銀行出納帳_'+safe(sess.bankName||'銀行CSV')+(sess.accountNo?'_'+safe(sess.accountNo):'')+'_'+jp+'.csv';
      dlCSV(rows, fname);
    });
  }).catch(function(e){ console.error('銀行CSV出力に失敗:', e); });
}

function dlCSV(rows,filename) {

}

function importBackup(ev) {
  const file=ev.target.files[0]; if (!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try {
      const d=JSON.parse(e.target.result);
      if (!d.settings||!d.entries||!d.advances){ alert('無効なバックアップファイルです。'); return; }
      _pendingBackupData=d;
      showRestoreModeModal(d);
    } catch (e) { alert('ファイルの読み込みに失敗しました。'); }
  };
  reader.readAsText(file); ev.target.value='';
}

function executeFullOverwrite() {
  if (!_pendingBackupData) return;
  if (!confirm('現在のすべてのデータをバックアップで上書きします。\n他拠点のデータも消去されます。本当によろしいですか？')) return;
  const d=_pendingBackupData;
  DB.set('settings', d.settings);
  DB.set('entries', d.entries);
  DB.set('advances', d.advances);
  DB.set('reimbursements', d.reimbursements||[]);
  _pendingBackupData=null;
  closeModal();
  alert('データを復元しました。');
  initApp();
}

function executeLocationMerge() {
  if (!_pendingBackupData) return;
  const checks=document.querySelectorAll('#restore-loc-checks input[type=checkbox]:checked');
  const selectedLocs=Array.prototype.map.call(checks, function(c){return c.dataset.loc;});
  if (selectedLocs.length===0) { alert('取り込む拠点を1つ以上選択してください。'); return; }
  if (!confirm('選択した拠点（'+selectedLocs.join('、')+'）の現在データを、バックアップ内容で置き換えます。\nその他の拠点のデータはそのまま残ります。よろしいですか？')) return;
  mergeLocationBackup(_pendingBackupData, selectedLocs);
  _pendingBackupData=null;
  closeModal();
  alert('選択した拠点のデータをマージ復元しました：'+selectedLocs.join('、'));
  initApp();
}

function mergeLocationBackup(d, selectedLocs) {
  const locSet={};
  selectedLocs.forEach(function(l){ locSet[l]=true; });

  // 1) バックアップから選択拠点分を抽出
  const bEntries=(d.entries||[]).filter(function(e){return locSet[e.location||''];}).map(function(e){return Object.assign({},e);});
  const bAdvances=(d.advances||[]).filter(function(a){return locSet[a.location||''];}).map(function(a){return Object.assign({},a);});
  const bReims=(d.reimbursements||[]).filter(function(r){return locSet[r.location||''];}).map(function(r){return Object.assign({},r);});

  // 2) 現在データから選択拠点分を除外
  const curEntries=getEntries().filter(function(e){return !locSet[e.location||''];});
  const curAdvances=getAdvances().filter(function(a){return !locSet[a.location||''];});
  const curReims=getReimbursements().filter(function(r){return !locSet[r.location||''];});

  // 3) entry ID を採番し直し（衝突回避）
  var nextEntryNum=curEntries.reduce(function(m,e){return Math.max(m,parseInt(String(e.id||'').replace(/^E/,''))||0);},0)+1;
  const entryIdMap={};
  bEntries.forEach(function(e){
    const newId='E'+String(nextEntryNum++).padStart(4,'0');
    entryIdMap[e.id]=newId;
    e.id=newId;
  });

  // 4) advance ID を採番し直し（氏名スコープで連番）
  const advCounters={};
  curAdvances.forEach(function(a){
    const m=String(a.id||'').match(/^(.+)-(\d+)$/);
    if (m) advCounters[m[1]]=Math.max(advCounters[m[1]]||0, parseInt(m[2])||0);
  });
  const advIdMap={};
  bAdvances.forEach(function(a){
    const clean=(a.employeeName||'').replace(/\s+/g,'');
    advCounters[clean]=(advCounters[clean]||0)+1;
    const newId=clean+'-'+String(advCounters[clean]).padStart(3,'0');
    advIdMap[a.id]=newId;
    a.id=newId;
    if (a.cashEntryId)        a.cashEntryId=entryIdMap[a.cashEntryId]||null;
    if (a.settlementEntryId)  a.settlementEntryId=entryIdMap[a.settlementEntryId]||null;
    if (a.discrepancyEntryId) a.discrepancyEntryId=entryIdMap[a.discrepancyEntryId]||null;
  });

  // 5) reimbursement ID を採番し直し
  const reimCounters={};
  curReims.forEach(function(r){
    const m=String(r.id||'').match(/^R-(.+)-(\d+)$/);
    if (m) reimCounters[m[1]]=Math.max(reimCounters[m[1]]||0, parseInt(m[2])||0);
  });
  const reimIdMap={};
  bReims.forEach(function(r){
    const clean=(r.employeeName||'').replace(/\s+/g,'');
    reimCounters[clean]=(reimCounters[clean]||0)+1;
    const newId='R-'+clean+'-'+String(reimCounters[clean]).padStart(3,'0');
    reimIdMap[r.id]=newId;
    r.id=newId;
    if (r.reimbursementEntryId) r.reimbursementEntryId=entryIdMap[r.reimbursementEntryId]||null;
  });

  // 6) entry の advanceId / reimbursementId 参照を更新
  bEntries.forEach(function(e){
    if (e.advanceId && advIdMap[e.advanceId])           e.advanceId=advIdMap[e.advanceId];
    if (e.reimbursementId && reimIdMap[e.reimbursementId]) e.reimbursementId=reimIdMap[e.reimbursementId];
  });

  // 7) settings の locations と locationOpeningBalances をマージ
  const curSettings=getSettings()||{};
  const newSettings=Object.assign({}, curSettings);
  const curLocs=curSettings.locations||[];
  newSettings.locations=Array.from(new Set(curLocs.concat(selectedLocs)));
  newSettings.locationOpeningBalances=Object.assign({}, curSettings.locationOpeningBalances||{});
  const bLOB=(d.settings&&d.settings.locationOpeningBalances)||{};
  selectedLocs.forEach(function(loc){
    if (bLOB[loc]!=null) newSettings.locationOpeningBalances[loc]=bLOB[loc];
  });
  DB.set('settings', newSettings);

  // 8) 保存
  DB.set('entries', curEntries.concat(bEntries));
  DB.set('advances', curAdvances.concat(bAdvances));
  DB.set('reimbursements', curReims.concat(bReims));
}

// IndexedDB
function bankOpenDB() {
  if (_bankIDB) return Promise.resolve(_bankIDB);
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open('CashLedgerBankDB', 1);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('sessions'))
        db.createObjectStore('sessions', { keyPath: 'id' });
    };
    req.onsuccess = function(e) { _bankIDB = e.target.result; resolve(_bankIDB); };
    req.onerror = function(e) { reject(e); };
  });
}
function bankSaveSession(sess) {
  return bankOpenDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction('sessions','readwrite');
      tx.objectStore('sessions').put(sess);
      tx.oncomplete = resolve; tx.onerror = reject;
    });
  });
}
function bankLoadAllSessions() {
  return bankOpenDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction('sessions','readonly');
      var req = tx.objectStore('sessions').getAll();
      req.onsuccess = function() { resolve(req.result || []); };
      req.onerror = reject;
    });
  });
}
function bankDeleteSession(id) {
  return bankOpenDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction('sessions','readwrite');
      tx.objectStore('sessions').delete(id);
      tx.oncomplete = resolve; tx.onerror = reject;
    });
  });
}

// 文字コード自動検出
function bankDetectEncoding(buf) {
  var b = new Uint8Array(buf);
  if (b[0]===0xEF && b[1]===0xBB && b[2]===0xBF) return 'utf-8';
  if (b[0]===0xFF && b[1]===0xFE) return 'utf-16le';
  for (var i=0; i<Math.min(b.length-1,2000); i++) {
    if (b[i]===0x1B && (b[i+1]===0x24 || b[i+1]===0x28)) return 'iso-2022-jp';
  }
  var sjis=0, euc=0;
  for (var j=0; j<Math.min(b.length-1,3000); j++) {
    var c=b[j];
    if ((c>=0x81&&c<=0x9F)||(c>=0xE0&&c<=0xFC)) { sjis++; j++; }
    else if (c>=0xA1&&c<=0xFE) { if (b[j+1]>=0xA1&&b[j+1]<=0xFE) { euc++; j++; } }
  }
  if (sjis===0&&euc===0) return 'utf-8';
  return sjis>=euc ? 'shift_jis' : 'euc-jp';
}

// CSV解析
function bankParseCSV(text) {
  text = text.normalize('NFC').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var rows = [];
  var lines = text.split('\n');
  for (var li=0; li<lines.length; li++) {
    var line = lines[li];
    if (line.trim()==='') continue;
    var cells=[], i=0;
    while (i<line.length) {
      if (line[i]==='"') {
        var cell=''; i++;
        while (i<line.length) {
          if (line[i]==='"'&&line[i+1]==='"') { cell+='"'; i+=2; }
          else if (line[i]==='"') { i++; break; }
          else { cell+=line[i++]; }
        }
        cells.push(cell);
        if (line[i]===',') i++;
      } else {
        var end=line.indexOf(',',i);
        if (end===-1) { cells.push(line.slice(i)); i=line.length; }
        else { cells.push(line.slice(i,end)); i=end+1; }
      }
    }
    rows.push(cells);
  }
  return rows;
}

// 金額解析（括弧表記対応）
function bankParseAmount(str) {
  if (str==null||str==='') return 0;
  var s = String(str).replace(/,/g,'').replace(/¥/g,'').trim();
  var neg=false;
  if (s.startsWith('(')&&s.endsWith(')')) { neg=true; s=s.slice(1,-1); }
  var n = parseFloat(s);
  if (isNaN(n)) return 0;
  return neg ? -n : n;
}

// 日付正規化
function bankNormalizeDate(str) {
  if (!str||!str.trim()) return '';
  var s = str.trim().replace(/[年月・]/g,'/').replace(/[日]/g,'');
  var parts = s.split(/[\/\-]/);
  if (parts.length===3) {
    var y = parts[0].length===2 ? '20'+parts[0] : parts[0];
    return y+'-'+parts[1].padStart(2,'0')+'-'+parts[2].padStart(2,'0');
  }
  if (parts.length===2) {
    var now=new Date();
    return now.getFullYear()+'-'+parts[0].padStart(2,'0')+'-'+parts[1].padStart(2,'0');
  }
  return str;
}

function bankUpsertProfile(bankName, accountNo, roles) {
  if (!bankName||!bankName.trim()) return;
  var profiles=bankGetProfiles();
  var key=bankProfileKey(bankName, accountNo);
  var idx=profiles.findIndex(function(p){return bankProfileKey(p.bankName, p.accountNo)===key;});
  var profile={
    bankName:bankName.trim(),
    accountNo:(accountNo||'').trim(),
    roles:JSON.parse(JSON.stringify(roles||{})),
    lastUsed:new Date().toISOString()
  };
  if (idx>=0) profiles[idx]=profile;
  else profiles.push(profile);
  profiles.sort(function(a,b){return (b.lastUsed||'').localeCompare(a.lastUsed||'');});
  bankSaveProfiles(profiles);
}

  date:        { label:'日付', color:'#1e40af', bg:'#dbeafe' },
  description: { label:'摘要', color:'#166534', bg:'#dcfce7' },
  receipt:     { label:'入金', color:'#15803d', bg:'#dcfce7' },
  payment:     { label:'出金', color:'#b91c1c', bg:'#fee2e2' },
  balance:     { label:'残高', color:'#6d28d9', bg:'#ede9fe' },
};

// 自動保存
function bankScheduleAutoSave() {
  if (bankEditAutoSaveTimer) clearTimeout(bankEditAutoSaveTimer);
  bankEditAutoSaveTimer = setTimeout(function() {
    if (!bankCurrentSession) return;
    bankCurrentSession.updatedAt = new Date().toISOString();
    bankSaveSession(bankCurrentSession).then(function() {
      if (bankSessionCache) {
        var idx=bankSessionCache.findIndex(function(s){return s.id===bankCurrentSession.id;});
        if (idx>=0) bankSessionCache[idx]=bankCurrentSession;
        else bankSessionCache.push(bankCurrentSession);
      }
      var el=document.getElementById('bank-save-ind');
      if (el) {
        var t=new Date();
        el.textContent='自動保存済 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
        el.style.opacity='1';
        setTimeout(function(){if(el)el.style.opacity='0.5';},3000);
      }
    });
  }, 800);
}

// セッションマージ（同銀行・同口座の重複排除）
function bankMergeSessions(base, other) {
  var seen=new Set(base.rows.map(function(r){
    return r.date+'_'+r.receipt+'_'+r.payment+'_'+r.balance;
  }));
  var added=0;
  other.rows.forEach(function(r) {
    var k=r.date+'_'+r.receipt+'_'+r.payment+'_'+r.balance;
    if (!seen.has(k)) { base.rows.push(r); seen.add(k); added++; }
  });
  base.rows.sort(function(a,b){return a.date.localeCompare(b.date);});
  return added;
}

function pageBankCSV() {
  if (bankCsvPage==='list') {
    if (bankSessionCache===null) {
      bankLoadAllSessions().then(function(sessions) {
        bankSessionCache=sessions.sort(function(a,b){return b.updatedAt.localeCompare(a.updatedAt);});
        renderPage();
      }).catch(function(){ bankSessionCache=[]; renderPage(); });
      return '<div class="card"><div class="empty-state"><div class="icon">🏦</div><p>読み込み中...</p></div></div>';
    }
    return bankPageList();
  }
  if (bankCsvPage==='importing') return bankPageImport();
  if (bankCsvPage==='mapping')   return bankPageMapping();
  if (bankCsvPage==='editing')   return bankPageEdit();
  return '';
}

function bankOnDrop(event) {
  event.preventDefault();
  var dz=document.getElementById('bank-drop-zone');
  if (dz) dz.classList.remove('drag-over');
  var file=event.dataTransfer.files[0];
  if (file) bankReadFile(file);
}
function bankOnFileSelect(event) {
  var file=event.target.files[0];
  if (file) bankReadFile(file);
  event.target.value='';
}
function bankReadFile(file) {
  var reader=new FileReader();
  reader.onload=function(e) {
    var buf=e.target.result;
    var enc=bankDetectEncoding(buf);
    var text;
    try { text=new TextDecoder(enc,{fatal:false}).decode(buf); }
    catch(ex) { text=new TextDecoder('utf-8',{fatal:false}).decode(buf); }
    if (text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    var parsed=bankParseCSV(text);
    if (parsed.length<2) { alert('CSVの解析に失敗しました。ファイルを確認してください。'); return; }
    var hdrIdx=bankFindBestHeaderRow(parsed);
    var headerRow=parsed[hdrIdx]||parsed[0];
    var hdrLen=headerRow.length;
    bankImportedData={
      fileName:file.name, encoding:enc,
      headers:headerRow,
      preambleRowCount:hdrIdx,
      rows:parsed.slice(hdrIdx+1).filter(function(r){
        if (!r.some(function(c){return (c||'').trim()!=='';})) return false;
        return r.length>=Math.max(3, Math.floor(hdrLen/2));
      })
    };
    bankColumnRoles={description:[]};
    bankActiveRole=null;
    bankNameCache='';
    bankAcctCache='';
    bankAutoDetectColumns(bankImportedData.headers);
    bankCsvPage='mapping';
    renderPage();
  };
  reader.readAsArrayBuffer(file);
}

function bankAutoDetectColumns(headers) {
  var dateKw  =['日付','DATE','取引日','年月日','取引年月日','Value Date'];
  var descKw  =['摘要','内容','取引内容','取引摘要','説明','Description'];
  var recKw   =['入金','入金額','入金金額','受入','受入金額','預入','預入金額','お預かり','預金','Deposit','Credit'];
  var payKw   =['出金','出金額','出金金額','支払','支払金額','お引き出し','引出','引落','引落額','Withdrawal','Debit'];
  var balKw   =['残高','差引残高','帳尻','Balance'];
  function match(h,kws) {
    var hu=h.trim().toUpperCase();
    return kws.some(function(k){return hu.indexOf(k.toUpperCase())!==-1;});
  }
  if (!Array.isArray(bankColumnRoles.description)) bankColumnRoles.description=[];
  headers.forEach(function(h,i) {
    if (bankColumnRoles.date==null && match(h,dateKw))         bankColumnRoles.date=i;
    else if (bankColumnRoles.description.length===0 && match(h,descKw)) bankColumnRoles.description=[i];
    else if (bankColumnRoles.receipt==null && match(h,recKw))  bankColumnRoles.receipt=i;
    else if (bankColumnRoles.payment==null && match(h,payKw))  bankColumnRoles.payment=i;
    else if (bankColumnRoles.balance==null && match(h,balKw))  bankColumnRoles.balance=i;
  });
}

// CSVの上部に口座番号・期間などのプリアンブル行がある場合に
// 実際の取引列ヘッダー行を見つけて、その行をヘッダーとして扱う。
function bankFindBestHeaderRow(parsed) {
  var keywords=['日付','年月日','取引日','摘要','内容','取引内容','入金','受入','預入','預金','出金','支払','引出','引落','残高','差引'];
  var best={idx:0, score:0, len:0};
  var limit=Math.min(parsed.length, 12);
  for (var i=0;i<limit;i++) {
    var row=parsed[i];
    if (!row||row.length<3) continue;
    var rowText=row.map(function(c){return (c||'').trim();}).filter(function(c){return c;}).join('|');
    if (!rowText) continue;
    var score=0;
    keywords.forEach(function(k){ if (rowText.indexOf(k)!==-1) score++; });
    if (score>best.score || (score===best.score && row.length>best.len)) {
      best={idx:i, score:score, len:row.length};
    }
  }
  return best.score>=2 ? best.idx : 0;
}

function bankNormalizeColumnRoles() {
  if (!bankColumnRoles || typeof bankColumnRoles!=='object') bankColumnRoles={};
  if (typeof bankColumnRoles.description==='number') bankColumnRoles.description=[bankColumnRoles.description];
  if (!Array.isArray(bankColumnRoles.description)) bankColumnRoles.description=[];
}
function bankGetRoleForCol(colIdx) {
  if (bankColumnRoles.date===colIdx) return 'date';
  if (bankColumnRoles.receipt===colIdx) return 'receipt';
  if (bankColumnRoles.payment===colIdx) return 'payment';
  if (bankColumnRoles.balance===colIdx) return 'balance';
  if ((bankColumnRoles.description||[]).indexOf(colIdx)>=0) return 'description';
  return null;
}
function bankCacheMappingInputs() {
  var n=document.getElementById('bank-name-input');
  var a=document.getElementById('bank-acct-input');
  if (n) bankNameCache=n.value;
  if (a) bankAcctCache=a.value;
}
function bankSetActiveRole(role) {
  bankCacheMappingInputs();
  bankActiveRole=(bankActiveRole===role)?null:role;
  renderPage();
}
function bankAssignRole(colIdx) {
  bankCacheMappingInputs();
  bankNormalizeColumnRoles();
  if (!bankActiveRole) {
    alert('まず上の役割ボタン（日付/摘要/入金/出金/残高/解除）を選んでから、CSVの列ヘッダーをクリックしてください。');
    return;
  }
  if (bankActiveRole==='clear') {
    if (bankColumnRoles.date===colIdx) delete bankColumnRoles.date;
    if (bankColumnRoles.receipt===colIdx) delete bankColumnRoles.receipt;
    if (bankColumnRoles.payment===colIdx) delete bankColumnRoles.payment;
    if (bankColumnRoles.balance===colIdx) delete bankColumnRoles.balance;
    bankColumnRoles.description=bankColumnRoles.description.filter(function(i){return i!==colIdx;});
  } else if (bankActiveRole==='description') {
    var arr=bankColumnRoles.description.slice();
    var pos=arr.indexOf(colIdx);
    if (pos>=0) {
      arr.splice(pos,1);
    } else {
      if (bankColumnRoles.date===colIdx) delete bankColumnRoles.date;
      if (bankColumnRoles.receipt===colIdx) delete bankColumnRoles.receipt;
      if (bankColumnRoles.payment===colIdx) delete bankColumnRoles.payment;
      if (bankColumnRoles.balance===colIdx) delete bankColumnRoles.balance;
      arr.push(colIdx);
      arr.sort(function(a,b){return a-b;});
    }
    bankColumnRoles.description=arr;
  } else {
    bankColumnRoles.description=bankColumnRoles.description.filter(function(i){return i!==colIdx;});
    if (bankColumnRoles.date===colIdx) delete bankColumnRoles.date;
    if (bankColumnRoles.receipt===colIdx) delete bankColumnRoles.receipt;
    if (bankColumnRoles.payment===colIdx) delete bankColumnRoles.payment;
    if (bankColumnRoles.balance===colIdx) delete bankColumnRoles.balance;
    bankColumnRoles[bankActiveRole]=colIdx;
  }
  renderPage();
}

function bankStartEditing() {
  if (!bankImportedData) return;
  bankNormalizeColumnRoles();
  var bankName=(document.getElementById('bank-name-input')||{value:bankNameCache}).value.trim();
  var accountNo=(document.getElementById('bank-acct-input')||{value:bankAcctCache}).value.trim();
  if (bankName) bankUpsertProfile(bankName, accountNo, bankColumnRoles);
  var descCols=bankColumnRoles.description||[];
  var rows=bankImportedData.rows.map(function(row) {
    var dateStr=bankColumnRoles.date!=null?bankNormalizeDate(row[bankColumnRoles.date]||''):'';
    var descOrig=descCols.map(function(c){return (row[c]||'').trim();}).filter(function(s){return s;}).join(' ');
    var rec=bankColumnRoles.receipt!=null?bankParseAmount(row[bankColumnRoles.receipt]):0;
    var pay=bankColumnRoles.payment!=null?bankParseAmount(row[bankColumnRoles.payment]):0;
    var bal=bankColumnRoles.balance!=null?bankParseAmount(row[bankColumnRoles.balance]):0;
    var probe={descriptionOriginal:descOrig, receipt:rec, payment:pay};
    var initDesc=(bankClassifyRow(probe)==='needsInfo')?'':descOrig;
    return {date:dateStr, descriptionOriginal:descOrig, description:initDesc, receipt:rec, payment:pay, balance:bal};
  }).filter(function(r){return r.date||r.receipt||r.payment||r.balance;});
  rows.sort(function(a,b){return a.date.localeCompare(b.date);});

  // 既存セッションとのマージ確認
  var existing=null;
  if (bankSessionCache&&bankName) {
    existing=bankSessionCache.find(function(s){return s.bankName===bankName&&s.accountNo===accountNo;});
  }
  if (existing) {
    var added=bankMergeSessions(existing,{rows:rows.map(function(r){return Object.assign({},r);})});
    if (confirm('同じ銀行・口座のセッションが存在します。\n重複を除いて '+added+' 行をマージしますか？\n（キャンセルすると新規セッションとして保存します）')) {
      existing.updatedAt=new Date().toISOString();
      bankCurrentSession=existing;
      bankEditFilter='attention';bankCsvPage='editing';
      bankSaveSession(existing).then(function(){renderPage();});
      return;
    }
  }

  var sess={
    id:'bank_'+Date.now(),
    bankName:bankName, accountNo:accountNo,
    fileName:bankImportedData.fileName,
    originalHeaders:bankImportedData.headers,
    columnMapping:Object.assign({},bankColumnRoles),
    rows:rows,
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };
  bankCurrentSession=sess;
  if (!bankSessionCache) bankSessionCache=[];
  bankSessionCache.unshift(sess);
  bankSaveSession(sess);
  bankEditFilter='attention';bankCsvPage='editing';
  renderPage();
}

function bankResumeSession(id) {
  var sess=(bankSessionCache||[]).find(function(s){return s.id===id;});
  if (sess) { bankCurrentSession=sess; bankEditFilter='attention';bankCsvPage='editing'; renderPage(); return; }
  bankOpenDB().then(function(db){
    var tx=db.transaction('sessions','readonly');
    var req=tx.objectStore('sessions').get(id);
    req.onsuccess=function(){
      if (req.result){bankCurrentSession=req.result;bankEditFilter='attention';bankCsvPage='editing';renderPage();}
    };
  });
}
function bankConfirmDelete(id) {
  if (!confirm('このセッションを削除しますか？')) return;
  bankDeleteSession(id).then(function(){
    if (bankSessionCache) bankSessionCache=bankSessionCache.filter(function(s){return s.id!==id;});
    if (bankCurrentSession&&bankCurrentSession.id===id) bankCurrentSession=null;
    renderPage();
  });
}

var BANK_TRANSFER_DOC_KEYWORDS = ['振込資金','フリコミカワリキン','フリコミシキン','フリカエシキン','カワリキン','振替金','送金資金','フリコミシ'];
var BANK_GENERIC_DESC_PATTERNS = ['AD','D','CD','ATM','預金機','カード','カードAD','カードD','機械','現金'];
var BANK_LOAN_KEYWORDS = ['借入','借り入れ','借入金','ローン','融資','金消','金銭消費貸借','手形貸付','手形借入','手貸','ﾃｶﾞﾀｶｼﾂｹ','ﾃｶﾞﾀｶﾘｲﾚ','当座貸越','当貸','証書貸付','ｶﾘｲﾚ','ｶﾘｲﾚｷﾝ','ｶﾘｲﾚｷﾝｺｳﾆｭｳ','カリイレ','カリイレキン','LOAN'];
var BANK_AUTO_KEYWORDS = ['トヨタ','ﾄﾖﾀ','ホンダ','ﾎﾝﾀﾞ','日産','ﾆｯｻﾝ','ニッサン','マツダ','ﾏﾂﾀﾞ','スバル','ｽﾊﾞﾙ','スズキ','ｽｽﾞｷ','ダイハツ','ﾀﾞｲﾊﾂ','レクサス','ﾚｸｻｽ','三菱自動車','ｶｰﾃﾞｨｰﾗｰ','カーディーラー','自動車','ｼﾞﾄﾞｳｼﾔ','ｼﾞﾄﾞｳｼｬ','モータース','ﾓｰﾀｰｽ','ネッツ','ﾈｯﾂ','カローラ','ｶﾛｰﾗ','ＶＷ','VW','フォルクスワーゲン','BMW','ベンツ','ﾍﾞﾝﾂ','アウディ','ｱｳﾃﾞｨ','ポルシェ','ﾎﾟﾙｼｪ','カーリース','ｶｰﾘｰｽ','オートリース','ｵｰﾄﾘｰｽ','整備工場','板金','ｾｲﾋﾞ','ｶｰｼｮｯﾌﾟ','カーショップ','車検','ｼｬｹﾝ'];
var BANK_LOAN_RECEIPT_THRESHOLD = 1000000;

function bankClassifyByOrig(orig) {
  var s=(orig||'').trim();
  for (var i=0;i<BANK_TRANSFER_DOC_KEYWORDS.length;i++) {
    if (s.indexOf(BANK_TRANSFER_DOC_KEYWORDS[i])!==-1) return 'needsPDF';
  }
  if (!s) return 'needsInfo';
  var stripped=s.replace(/[\d\s\.\-\/:時分日年月()（）　,，。、]/g,'').trim();
  if (!stripped) return 'needsInfo';
  if (stripped.length<=2) return 'needsInfo';
  if (BANK_GENERIC_DESC_PATTERNS.indexOf(stripped)!==-1) return 'needsInfo';
  if (BANK_GENERIC_DESC_PATTERNS.indexOf(stripped.toUpperCase())!==-1) return 'needsInfo';
  return 'ok';
}
function bankClassifyOrig(orig) { return bankClassifyByOrig(orig); }

function bankClassifyRow(r) {
  if (!r) return 'ok';
  var receipt=Number(r.receipt||0);
  var payment=Number(r.payment||0);
  // 入出金が無い行（繰越・残高調整など）は対応不要
  if (receipt===0 && payment===0) return 'ok';
  var orig=(r.descriptionOriginal||'').trim();
  var base=bankClassifyByOrig(orig);
  if (base==='needsPDF') return 'needsPDF';
  if (base==='needsInfo') return 'needsInfo';
  if (receipt>=BANK_LOAN_RECEIPT_THRESHOLD) {
    for (var j=0;j<BANK_LOAN_KEYWORDS.length;j++) {
      if (orig.indexOf(BANK_LOAN_KEYWORDS[j])!==-1) return 'needsPDF';
    }
  }
  if (payment>0) {
    for (var k=0;k<BANK_AUTO_KEYWORDS.length;k++) {
      if (orig.indexOf(BANK_AUTO_KEYWORDS[k])!==-1) return 'needsPDF';
    }
  }
  return 'ok';
}

function bankRowReason(r) {
  if (!r) return '';
  var orig=(r.descriptionOriginal||'').trim();
  for (var i=0;i<BANK_TRANSFER_DOC_KEYWORDS.length;i++) {
    if (orig.indexOf(BANK_TRANSFER_DOC_KEYWORDS[i])!==-1) return 'transfer';
  }
  if (Number(r.receipt||0)>=BANK_LOAN_RECEIPT_THRESHOLD) {
    for (var j=0;j<BANK_LOAN_KEYWORDS.length;j++) {
      if (orig.indexOf(BANK_LOAN_KEYWORDS[j])!==-1) return 'loan';
    }
  }
  if (Number(r.payment||0)>0) {
    for (var k=0;k<BANK_AUTO_KEYWORDS.length;k++) {
      if (orig.indexOf(BANK_AUTO_KEYWORDS[k])!==-1) return 'auto';
    }
  }
  return orig?'generic':'empty';
}

function bankRowState(r) {
  var cls=bankClassifyRow(r);
  var desc=((r&&r.description)||'').trim();
  var orig=((r&&r.descriptionOriginal)||'').trim();
  if (cls==='needsInfo') {
    var hasNewDesc=desc.length>0 && desc!==orig;
    return hasNewDesc?'resolvedInfo':'needsInfo';
  }
  if (cls==='needsPDF') return r.pdfSent?'resolvedPDF':'needsPDF';
  return 'ok';
}
function bankRowClassName(state) {
  if (state==='needsInfo')    return 'bank-row-needinfo';
  if (state==='needsPDF')     return 'bank-row-needpdf';
  if (state==='resolvedInfo'||state==='resolvedPDF') return 'bank-row-resolved';
  return '';
}

function bankReasonBadge(state, reason) {
  if (state==='needsInfo') return '<div class="bank-status-badge bank-status-needinfo">❗ 相手先情報を入力</div>';
  if (state==='resolvedInfo') return '<div class="bank-status-badge bank-status-resolved">✓ 入力済</div>';
  if (state==='resolvedPDF') return '<div class="bank-status-badge bank-status-resolved">✓ PDF送付済</div>';
  if (state==='needsPDF') {
    if (reason==='loan') return '<div class="bank-status-badge bank-status-needpdf">📎 借入関連書類PDFを税理士へ送付</div>';
    if (reason==='auto') return '<div class="bank-status-badge bank-status-needpdf">📎 自動車関連書類PDFを税理士へ送付</div>';
    return '<div class="bank-status-badge bank-status-needpdf">📎 振込明細PDFを税理士へ送付</div>';
  }
  return '';
}

function bankPageEdit() {
  if (!bankCurrentSession) { bankCsvPage='list'; bankSessionCache=null; return pageBankCSV(); }
  var sess=bankCurrentSession;
  var rows=sess.rows;
  var stateCounts={needsInfo:0, resolvedInfo:0, needsPDF:0, resolvedPDF:0, ok:0};
  var pdfReasonCounts={transfer:0, loan:0, auto:0};
  rows.forEach(function(r){
    var st=bankRowState(r);
    stateCounts[st]++;
    if (st==='needsPDF') {
      var rsn=bankRowReason(r);
      if (pdfReasonCounts[rsn]!=null) pdfReasonCounts[rsn]++;
    }
  });

  var attentionCount=stateCounts.needsInfo+stateCounts.needsPDF;
  var resolvedCount=stateCounts.resolvedInfo+stateCounts.resolvedPDF;
  var showAttentionOnly=(bankEditFilter==='attention');

  var visibleRows=rows.map(function(r,i){return {r:r,i:i,state:bankRowState(r)};});
  if (showAttentionOnly) {
    visibleRows=visibleRows.filter(function(x){
      return x.state==='needsInfo'||x.state==='needsPDF'||x.state==='resolvedInfo'||x.state==='resolvedPDF';
    });
  }

  var tableRows=visibleRows.map(function(x) {
    var r=x.r, i=x.i, state=x.state;
    var reason=bankRowReason(r);
    var rowCls=bankRowClassName(state);
    var amount=Math.max(Math.abs(r.receipt||0),Math.abs(r.payment||0));
    var dayOfMonth=r.date?parseInt(r.date.split('-')[2])||0:0;
    var suggestions=bankAutoComplete(amount,dayOfMonth);
    var dlId='bank-ac-'+i;
    var dlHtml=suggestions.length>0
      ?'<datalist id="'+dlId+'">'+suggestions.map(function(s){return '<option value="'+esc(s)+'">';}).join('')+'</datalist>'
      :'';
    var badge=bankReasonBadge(state, reason);
    var inputBorder='var(--gray-300)';
    var inputBg='white';
    if (state==='needsInfo') { inputBorder='#dc2626'; inputBg='#fef2f2'; }
    else if (state==='needsPDF') { inputBorder='#7c3aed'; inputBg='#faf5ff'; }
    var pdfChk='';
    if (bankClassifyRow(r)==='needsPDF') {
      pdfChk='<label style="display:flex;align-items:center;gap:4px;font-size:11px;margin-top:4px;cursor:pointer;white-space:nowrap;">'
        +'<input type="checkbox" '+(r.pdfSent?'checked':'')+' onchange="bankTogglePdfSent('+i+',this.checked)" style="margin:0;" />'
        +'<span>PDF送付済</span></label>';
    }
    return '<tr class="'+rowCls+'">'
      +'<td style="white-space:nowrap;font-size:12px;vertical-align:top;">'+esc(r.date||'')+'</td>'
      +'<td style="font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;vertical-align:top;">'
        +'<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(r.descriptionOriginal||'(空欄)')+'</div>'
        +badge
      +'</td>'
      +'<td style="vertical-align:top;">'+dlHtml
      +'<input type="text" class="bank-desc-input" value="'+esc(r.description||'')+'" placeholder="摘要を入力" '
      +(suggestions.length>0?'list="'+dlId+'" ':'')
      +'style="width:100%;padding:5px 7px;border:1px solid '+inputBorder+';border-radius:5px;font-size:12px;font-family:inherit;background:'+inputBg+';" '
      +'oninput="bankUpdateDesc('+i+',this.value)" '
      +'onblur="bankDescBlur('+i+',this.value)" />'
      +pdfChk
      +'</td>'
      +'<td class="r mono" style="font-size:12px;white-space:nowrap;vertical-align:top;">'+(r.receipt>0?fc(r.receipt):'')+'</td>'
      +'<td class="r mono" style="font-size:12px;white-space:nowrap;vertical-align:top;">'+(r.payment>0?fc(r.payment):'')+'</td>'
      +'<td class="r mono" style="font-size:12px;white-space:nowrap;vertical-align:top;">'+(r.balance!==0?fc(r.balance):'')+'</td>'
      +'</tr>';
  }).join('');

  if (tableRows==='') {
    tableRows='<tr><td colspan="6" style="text-align:center;color:var(--gray-400);padding:20px;font-size:13px;">'
      +(showAttentionOnly?'要対応行はありません。「全明細を表示」で全行を確認できます。':'表示できる明細がありません。')
      +'</td></tr>';
  }

  var alertHtml='';
  if (stateCounts.needsInfo===0 && stateCounts.needsPDF===0) {
    alertHtml='<div class="alert alert-success" style="margin-bottom:10px;">✅ 全ての要対応行が処理されています</div>';
  } else {
    var bits=[];

      bits.push('<div style="margin-bottom:6px;color:#991b1b;"><span class="bank-status-badge bank-status-needinfo">❗ 相手先情報を入力</span> '
        +'未対応 <strong>'+stateCounts.needsInfo+'</strong> 行 / 入力済 '+stateCounts.resolvedInfo+' 行<br>'

    }
    if (stateCounts.needsPDF>0||stateCounts.resolvedPDF>0) {
      var pdfDetail=[];
      if (pdfReasonCounts.transfer>0) pdfDetail.push('振込明細PDF '+pdfReasonCounts.transfer+'行');
      if (pdfReasonCounts.loan>0)     pdfDetail.push('借入関連書類PDF '+pdfReasonCounts.loan+'行');
      if (pdfReasonCounts.auto>0)     pdfDetail.push('自動車関連書類PDF '+pdfReasonCounts.auto+'行');

    }
    alertHtml='<div class="alert" style="margin-bottom:10px;background:#fffbeb;border:1px solid #fde047;color:#713f12;padding:10px 14px;">'
      +bits.join('<div style="height:8px;"></div>')
      +'</div>';
  }

  var filterBar='<div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">'
    +'<span style="font-size:12px;color:var(--gray-600);font-weight:700;">表示:</span>'

    +'<button class="btn btn-xs '+(!showAttentionOnly?'btn-primary':'btn-secondary')+'" onclick="bankSetEditFilter(\'all\')">'
    +'📋 全明細を表示（'+rows.length+'行）</button>'
    +(showAttentionOnly?'<span style="font-size:11px;color:var(--gray-500);">※ 通常の取引行（'+stateCounts.ok+'行）は非表示</span>':'')
    +'</div>';

  return '<div class="card">'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">'

    +'<span id="bank-save-ind" style="font-size:11px;color:var(--gray-400);opacity:0.5;"></span>'

    +'</div>'
    +'</div>'
    +alertHtml
    +filterBar
    +'<div style="overflow-x:auto;"><table class="table-grid" style="font-size:13px;">'
    +'<thead><tr>'
    +'<th style="min-width:90px;">日付</th>'

    +'</tr></thead>'
    +'<tbody>'+tableRows+'</tbody>'
    +'</table></div>'
    +'</div>';

function bankSetEditFilter(mode) {
  bankEditFilter=(mode==='all'?'all':'attention');
  renderPage();
}

function bankUpdateDesc(rowIdx, value) {
  if (!bankCurrentSession) return;
  var r=bankCurrentSession.rows[rowIdx];
  if (!r) return;
  r.description=value;
  var inputs=document.querySelectorAll('.bank-desc-input');
  var inp=inputs[rowIdx];
  if (inp) {
    var state=bankRowState(r);
    var border='var(--gray-300)', bg='white';
    if (state==='needsInfo') { border='#dc2626'; bg='#fef2f2'; }
    else if (state==='needsPDF') { border='#7c3aed'; bg='#faf5ff'; }
    inp.style.borderColor=border;
    inp.style.background=bg;
    var tr=inp.closest('tr');
    if (tr) tr.className=bankRowClassName(state);
  }
  bankScheduleAutoSave();
}
function bankTogglePdfSent(rowIdx, checked) {
  if (!bankCurrentSession) return;
  var r=bankCurrentSession.rows[rowIdx];
  if (!r) return;
  r.pdfSent=!!checked;
  bankScheduleAutoSave();
  renderPage();
}
function bankDescBlur(rowIdx, value) {
  if (!bankCurrentSession) return;
  bankCurrentSession.rows[rowIdx].description=value;
  if (value&&value.trim()) {
    var r=bankCurrentSession.rows[rowIdx];
    var amount=Math.max(Math.abs(r.receipt||0),Math.abs(r.payment||0));
    var day=r.date?parseInt(r.date.split('-')[2])||0:0;
    bankLearnHistory(value.trim(),amount,day);
  }
  bankScheduleAutoSave();
}

function bankDownloadCSV(sessionId) {
  var sess=bankCurrentSession&&bankCurrentSession.id===sessionId
    ?bankCurrentSession
    :(bankSessionCache||[]).find(function(s){return s.id===sessionId;});
  if (!sess) { alert('セッションが見つかりません。'); return; }
  var rows=[['日付','摘要','入金','出金','残高']];
  sess.rows.forEach(function(r){
    rows.push([r.date||'',r.description||'',r.receipt>0?r.receipt:'',r.payment>0?r.payment:'',r.balance!==0?r.balance:'']);
  });
  var name=(sess.bankName||'銀行CSV').replace(/[\\/:*?"<>|]/g,'_');
  dlCSV(rows, name+'_修正済_'+today()+'.csv');
}

function bankShowMergeModal(groupKey) {
  var sessions=(bankSessionCache||[]).filter(function(s){
    return ((s.bankName||'')+'|'+(s.accountNo||''))===groupKey;
  });
  if (sessions.length<2) return;
  if (!confirm('以下のセッションをマージします（重複行は除去されます）:\n'+sessions.map(function(s){return (s.fileName||s.id)+' ('+s.rows.length+'行)';}).join('\n'))) return;
  var base=sessions[0];
  for (var i=1;i<sessions.length;i++) bankMergeSessions(base,sessions[i]);
  base.updatedAt=new Date().toISOString();
  bankSaveSession(base).then(function(){
    var deletePromises=sessions.slice(1).map(function(s){return bankDeleteSession(s.id);});
    return Promise.all(deletePromises);
  }).then(function(){
    bankSessionCache=null;
    renderPage();
  });
}

function renderSvgToPngBytes(svgStr, size) {
  return new Promise(function(resolve, reject) {
    var img = new Image();
    img.onload = function() {
      var c=document.createElement('canvas');
      c.width=size; c.height=size;
      var ctx=c.getContext('2d');
      ctx.clearRect(0,0,size,size);
      ctx.drawImage(img,0,0,size,size);
      c.toBlob(function(blob) {
        if (!blob) { reject(new Error('toBlob failed')); return; }
        blob.arrayBuffer().then(function(buf){ resolve(new Uint8Array(buf)); }, reject);
      }, 'image/png');
    };
    img.onerror=function(){ reject(new Error('SVG load failed')); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
  });
}

function buildIcoBlob(pngArr) {
  var count=pngArr.length;
  var headerSize=6+16*count;
  var total=headerSize+pngArr.reduce(function(s,p){return s+p.bytes.length;},0);
  var buf=new ArrayBuffer(total);
  var view=new DataView(buf);
  var bytes=new Uint8Array(buf);
  view.setUint16(0,0,true);     // reserved
  view.setUint16(2,1,true);     // type=ICO
  view.setUint16(4,count,true); // count
  var off=headerSize;
  pngArr.forEach(function(p,i){
    var eo=6+16*i;
    var s=p.size>=256?0:p.size;
    view.setUint8(eo,s);
    view.setUint8(eo+1,s);
    view.setUint8(eo+2,0);
    view.setUint8(eo+3,0);
    view.setUint16(eo+4,1,true);    // planes
    view.setUint16(eo+6,32,true);   // bitCount
    view.setUint32(eo+8,p.bytes.length,true);
    view.setUint32(eo+12,off,true);
    bytes.set(p.bytes,off);
    off+=p.bytes.length;
  });
  return new Blob([buf],{type:'image/vnd.microsoft.icon'});
}

function downloadAppIcon() {
  var svg=getAppIconSvgString();
  var sizes=[16,32,48,64,128,256];
  Promise.all(sizes.map(function(s){
    return renderSvgToPngBytes(svg,s).then(function(b){return {size:s,bytes:b};});
  })).then(function(pngs){
    var blob=buildIcoBlob(pngs);
    var a=Object.assign(document.createElement('a'),{
      href:URL.createObjectURL(blob),
      download:'現金出納帳.ico'
    });
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  }).catch(function(e){
    alert('アイコンの生成に失敗しました: '+(e&&e.message||e));
  });
}

function initApp() {
  try {
    checkAndRestoreAutoBackup();
    const s=getSettings();
    if (!s){
      var hcEl=document.getElementById('header-company');
      if (hcEl) hcEl.textContent='初期設定';
      document.getElementById('setup-screen').style.display='flex';
      return;
    }
    document.getElementById('setup-screen').style.display='none';
    updateHeader(); renderPage();
    doAutoSave();
  } catch (err) {
    console.error('initApp error:', err);
    const hc=document.getElementById('header-company');
    if (hc) hc.textContent='読み込みエラー';
    const pc=document.getElementById('page-content');
    if (pc) pc.innerHTML=`<div class="card"><div class="card-title">⚠️ 起動エラー</div>
      <p style="margin-bottom:10px;">アプリの初期化中にエラーが発生しました。</p>
      <pre style="background:#f8fafc;padding:10px;border-radius:6px;font-size:11px;overflow:auto;">${esc(err&&err.message||err)}</pre>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('imp-recover').click()">📤 バックアップから復元</button>
        <input type="file" id="imp-recover" accept=".json" style="display:none;" onchange="importBackup(event)">
        <button class="btn btn-danger btn-sm" onclick="if(confirm('全データを削除して初期状態に戻します。よろしいですか？')){localStorage.clear();location.reload();}">🗑️ データを全削除して再起動</button>
      </div></div>`;
  }
}

window.addEventListener('beforeunload', function(){ try { doAutoSave(); } catch(e){} });

if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', initApp);
else initApp();
