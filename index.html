<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>介護売上管理</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* フォールバック（外部CSS未ロード時の最低限の見た目崩れ防止） */
    .view { display: none; }
    .view.active { display: block; }
    [hidden] { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- サイドバー -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-mark">介</div>
        <div class="logo-text">
          <div class="logo-title">介護売上管理</div>
          <div class="logo-sub">Sales Manager</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          <span>ダッシュボード</span>
        </button>
        <button class="nav-item" data-view="entry">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>売上入力</span>
        </button>
        <button class="nav-item" data-view="clients">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>利用者</span>
        </button>
        <button class="nav-item" data-view="services">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          <span>サービス分類</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="data-info">データはこのブラウザに保存中</div>
      </div>
    </aside>

    <!-- メイン -->
    <div class="main">
      <!-- トップバー -->
      <header class="topbar">
        <div class="page-title" id="pageTitle">ダッシュボード</div>
        <div class="topbar-right">
          <div class="month-picker">
            <button id="prevMonth" class="icon-btn" aria-label="前月">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span id="currentMonthLabel">2026年5月</span>
            <button id="nextMonth" class="icon-btn" aria-label="翌月">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
      </header>

      <div class="content">
        <!-- ダッシュボード -->
        <section id="view-dashboard" class="view active">
          <div class="kpi-row">
            <div class="kpi">
              <div class="kpi-icon kpi-icon-blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              </div>
              <div class="kpi-body">
                <div class="kpi-label">当月売上</div>
                <div class="kpi-value" id="kpiTotal">¥0</div>
                <div class="kpi-sub" id="kpiDiff">前月比 ―</div>
              </div>
            </div>
            <div class="kpi">
              <div class="kpi-icon kpi-icon-green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              </div>
              <div class="kpi-body">
                <div class="kpi-label">記録件数</div>
                <div class="kpi-value" id="kpiCount">0 件</div>
                <div class="kpi-sub" id="kpiClients">利用者 0 名</div>
              </div>
            </div>
            <div class="kpi">
              <div class="kpi-icon kpi-icon-purple">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
              </div>
              <div class="kpi-body">
                <div class="kpi-label">平均単価</div>
                <div class="kpi-value" id="kpiAvg">¥0</div>
                <div class="kpi-sub">1件あたり</div>
              </div>
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <div class="card-header">
                <h2>サービス分類別の内訳</h2>
              </div>
              <div id="serviceBreakdown" class="breakdown"></div>
            </div>

            <div class="card">
              <div class="card-header">
                <h2>利用者別 売上ランキング</h2>
                <button class="btn-secondary btn-sm" id="exportBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  Excel出力
                </button>
              </div>
              <div id="clientRanking" class="ranking"></div>
            </div>
          </div>

          <div class="quick-actions">
            <button class="btn-primary btn-lg" data-jump="entry">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              今月の売上を入力する
            </button>
            <button class="btn-secondary btn-lg" data-jump="clients">利用者を追加する</button>
          </div>
        </section>

        <!-- 売上入力 -->
        <section id="view-entry" class="view">
          <div class="card">
            <div class="card-header">
              <h2>当月の売上一覧</h2>
              <div class="header-actions">
                <button class="btn-secondary btn-sm" id="copyPrevMonth">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  先月分をコピー
                </button>
                <button class="btn-primary btn-sm" id="openEntryModal">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                  新規記録
                </button>
              </div>
            </div>

            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>日付</th>
                    <th>利用者</th>
                    <th>サービス分類</th>
                    <th class="num">金額</th>
                    <th>備考</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="entryTbody"></tbody>
                <tfoot>
                  <tr>
                    <td colspan="3" class="right">合計</td>
                    <td class="num" id="entryTotal">¥0</td>
                    <td colspan="2"></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </section>

        <!-- 利用者 -->
        <section id="view-clients" class="view">
          <div class="card">
            <div class="card-header">
              <h2>利用者マスタ</h2>
              <button class="btn-primary btn-sm" id="openClientModal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                利用者を追加
              </button>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr><th>氏名</th><th>要介護度</th><th>備考</th><th></th></tr>
                </thead>
                <tbody id="clientTbody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- サービス分類 -->
        <section id="view-services" class="view">
          <div class="card">
            <div class="card-header">
              <h2>サービス分類</h2>
              <button class="btn-primary btn-sm" id="openServiceModal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                分類を追加
              </button>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead><tr><th>分類名</th><th>使用件数</th><th></th></tr></thead>
                <tbody id="serviceTbody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- モーダル：売上入力 -->
  <div id="entryModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <div class="modal-header">
        <h3>売上を記録</h3>
        <button class="icon-btn" data-close aria-label="閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="entryForm" class="modal-body">
        <div class="field-group">
          <label>記録単位</label>
          <div class="segment">
            <label class="segment-item"><input type="radio" name="entryMode" value="monthly" checked /><span>月単位</span></label>
            <label class="segment-item"><input type="radio" name="entryMode" value="daily" /><span>日単位</span></label>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>利用者</label>
            <select id="entryClient" required></select>
          </div>
          <div class="field">
            <label>サービス分類</label>
            <select id="entryService" required></select>
          </div>
        </div>
        <div class="field-row">
          <div class="field" id="entryDateField" style="display:none;">
            <label>日付</label>
            <input type="date" id="entryDate" />
          </div>
          <div class="field">
            <label>金額（円）</label>
            <input type="number" id="entryAmount" min="0" step="1" required placeholder="0" />
          </div>
        </div>
        <div class="field">
          <label>備考</label>
          <input type="text" id="entryNote" placeholder="任意" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" data-close>キャンセル</button>
          <button type="submit" class="btn-primary">記録する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- モーダル：利用者 -->
  <div id="clientModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <div class="modal-header">
        <h3>利用者を追加</h3>
        <button class="icon-btn" data-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form id="clientForm" class="modal-body">
        <div class="field">
          <label>氏名</label>
          <input type="text" id="clientName" required />
        </div>
        <div class="field">
          <label>要介護度</label>
          <select id="clientCare">
            <option value="">（任意）</option>
            <option>要支援1</option><option>要支援2</option>
            <option>要介護1</option><option>要介護2</option><option>要介護3</option>
            <option>要介護4</option><option>要介護5</option>
          </select>
        </div>
        <div class="field">
          <label>備考</label>
          <input type="text" id="clientNote" placeholder="任意" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" data-close>キャンセル</button>
          <button type="submit" class="btn-primary">追加</button>
        </div>
      </form>
    </div>
  </div>

  <!-- モーダル：サービス分類 -->
  <div id="serviceModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <div class="modal-header">
        <h3>分類を追加</h3>
        <button class="icon-btn" data-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form id="serviceForm" class="modal-body">
        <div class="field">
          <label>分類名</label>
          <input type="text" id="serviceName" required placeholder="例: 訪問介護" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" data-close>キャンセル</button>
          <button type="submit" class="btn-primary">追加</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="script.js"></script>
</body>
</html>
